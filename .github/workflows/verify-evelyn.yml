name: Verify Evelyn

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-evelyn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EVELYN_RUN_REAL_MAIN_INTEGRATION: "1"
      PYTHONWARNINGS: "error::ResourceWarning"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Validate Python environment
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q main.py evelyn_core/runtime/evelyn_core

      - name: Check active browser JavaScript
        run: |
          node --check docs/assets/evelyn-live2d.js
          node --check docs/assets/evelyn-boot-progress.js

      - name: Check committed whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Run full regression and real main process smoke
        run: python -m unittest discover -s tests -t . -p "test_*.py"
