name: Verify Evelyn

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      prove_safeguards:
        description: 'Scoped negative proof: intentionally fail on wrong menu values; reruns must also reject them'
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-evelyn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safeguards:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EVELYN_TEST_ATTEMPT_ROOT: runtime_artifacts/validation/test_attempts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install verification dependencies
        # Existing requirements.lock versions; this job has a fresh Python environment.
        run: python -m pip install --disable-pip-version-check aiohttp==3.14.3 PyYAML==6.0.3
      - name: Verify automatic capture and independent oracle
        id: safeguards_tests
        run: python -m unittest tests.runtime.test_test_attempt tests.runtime.test_automatic_test_capture tests.runtime.test_minecraft_entrypoints tests.runtime.test_minecraft_menu_oracle
      - name: Compile owned Java fixtures
        run: |
          New-Item -ItemType Directory -Path .tmp/ci-java -Force | Out-Null
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.14.0/gson-2.14.0.jar' -OutFile .tmp/ci-java/gson.jar
          if ((Get-FileHash .tmp/ci-java/gson.jar -Algorithm SHA256).Hash -ne '2cbd119bf1961c28788310963dc80ba65f58cdeec1dd139c8bdb1240faa2c36f') { throw 'Gson checksum mismatch' }
          $sources = @(Get-ChildItem adapters/minecraft-client/src -Filter *.java -Recurse | ForEach-Object FullName)
          & javac --release 25 -encoding UTF-8 -cp .tmp/ci-java/gson.jar -d .tmp/ci-java @sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real Java normal values and rejection counterexample
        run: python -m tests.minecraft_direct.ci_menu_probe
      - name: Intentionally reject wrong product and matching old expected values
        if: inputs.prove_safeguards
        env:
          EVELYN_CI_INJECT_WRONG_MENU: '1'
        run: python -m tests.minecraft_direct.ci_menu_probe
      - name: Preserve safeguard attempts even on deliberate failure
        if: always() && steps.safeguards_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: safeguard-attempts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime_artifacts/validation/test_attempts/*/result.json
            runtime_artifacts/validation/test_attempts/*/events.jsonl
          if-no-files-found: error
          overwrite: false

  posix:
    if: ${{ !inputs.prove_safeguards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EVELYN_TEST_ATTEMPT_ROOT: runtime_artifacts/validation/posix_test_attempts
      PYTHONWARNINGS: "error::ResourceWarning"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native POSIX directory durability
        id: posix_test
        shell: python
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          assert os.name == "posix", "POSIX evidence requires a POSIX runner"
          subprocess.run([
              sys.executable, "-m", "unittest",
              "tests.runtime.test_runtime_artifact_io.RuntimeArtifactIoTests.test_posix_default_durable_write_syncs_parent_directory",
          ], check=True)
          receipts = list(Path(os.environ["EVELYN_TEST_ATTEMPT_ROOT"]).glob("*/result.json"))
          assert len(receipts) == 1, "Expected exactly one POSIX test receipt"
          receipt = json.loads(receipts[0].read_text(encoding="utf-8"))
          assert receipt["status"] == "PASS" and receipt["tests"] == 1 and receipt["skipped"] == 0, "POSIX test did not run and pass"
      - name: Preserve POSIX attempt on success or failure
        if: always() && steps.posix_test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: posix-attempts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime_artifacts/validation/posix_test_attempts/*/result.json
            runtime_artifacts/validation/posix_test_attempts/*/events.jsonl
          if-no-files-found: error
          overwrite: false

  dependency-security-linux:
    if: ${{ !inputs.prove_safeguards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVELYN_TEST_ATTEMPT_ROOT: runtime_artifacts/validation/security_test_attempts
      EVELYN_REQUIRE_PATCHED_DEPS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only security probe dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check ./tools/security_patches/accelerate ./tools/security_patches/transformers numpy==2.4.6 huggingface_hub==0.36.2 tokenizers==0.22.2 safetensors==0.8.0
          python -m pip check
      - name: Verify installed patches and native FIFO rejection
        id: security_tests
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from tools.audit_locked_dependencies import verify_installed_patches
          assert os.name == 'posix'
          manifest = json.loads(Path('tools/security_patches/manifest.json').read_text())
          verify_installed_patches(manifest)
          subprocess.run([sys.executable, '-m', 'unittest',
              'tests.hygiene.test_accelerate_checkpoint_security',
              'tests.hygiene.test_transformers_security'], check=True)
          receipts = list(Path(os.environ['EVELYN_TEST_ATTEMPT_ROOT']).glob('*/result.json'))
          assert len(receipts) == 1
          result = json.loads(receipts[0].read_text())
          assert result['status'] == 'PASS' and result['tests'] == 33 and result['skipped'] == 0
      - name: Preserve native security test attempts
        if: always() && steps.security_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: security-linux-attempts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime_artifacts/validation/security_test_attempts/*/result.json
            runtime_artifacts/validation/security_test_attempts/*/events.jsonl
          if-no-files-found: error
          overwrite: false

  regression:
    # Explicit negative proof is bounded; normal CI retains all original gates.
    if: ${{ !inputs.prove_safeguards }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EVELYN_RUN_REAL_MAIN_INTEGRATION: "1"
      PYTHONWARNINGS: "error::ResourceWarning"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Two composition-boundary tests compare signatures with historical main.py commits.
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Normalize Windows test temporary paths
        shell: python
        run: |
          import os
          import tempfile
          from pathlib import Path
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          test_temp = Path(tempfile.mkdtemp(prefix="evelyn-tests-", dir=runner_temp)).resolve()
          assert test_temp.is_relative_to(runner_temp)
          # Short Windows aliases must not masquerade as unsafe path redirection.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TEMP={test_temp}\nTMP={test_temp}\n")

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Validate Python environment
        id: python_environment
        run: python -m pip check

      - name: Verify unchanged Qwen-ASR import contract without loading weights
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -c "from qwen_asr import Qwen3ASRModel; from qwen_asr.core.transformers_backend.modeling_qwen3_asr import Qwen3ASRForConditionalGeneration; assert callable(Qwen3ASRModel.from_pretrained)"

      - name: Audit locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          # Preserve raw upstream findings; accept only source-verified backports.
          python tools/audit_locked_dependencies.py

      - name: Preserve complete dependency audit evidence
        if: always() && steps.python_environment.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime_artifacts/validation/dependency_audit/*/raw-audit.json
            runtime_artifacts/validation/dependency_audit/*/raw-exit.json
            runtime_artifacts/validation/dependency_audit/*/summary.json
            runtime_artifacts/validation/dependency_audit/*/upstream-inventory.txt
            runtime_artifacts/validation/dependency_audit/*/security_test_attempts/*/result.json
            runtime_artifacts/validation/dependency_audit/*/security_test_attempts/*/events.jsonl
          if-no-files-found: error
          overwrite: false

      - name: Audit Node dependencies at high severity
        if: ${{ !cancelled() && steps.python_environment.outcome == 'success' }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Compile Python sources
        if: ${{ !cancelled() && steps.python_environment.outcome == 'success' }}
        run: python -m compileall -q main.py evelyn_core/runtime/evelyn_core

      - name: Check active browser JavaScript
        if: ${{ !cancelled() && steps.python_environment.outcome == 'success' }}
        run: |
          node --check docs/assets/evelyn-live2d.js
          node --check docs/assets/evelyn-boot-progress.js

      - name: Check committed whitespace
        if: ${{ !cancelled() && steps.python_environment.outcome == 'success' }}
        shell: bash
        # Vendored browser assets preserve upstream whitespace for reproducible updates.
        run: git diff --check HEAD^ HEAD -- . ':(exclude)docs/assets/vendor/**'

      - name: Run full regression and real main process smoke
        id: regression_tests
        # Audit failures still fail the job, but must not hide functional regressions.
        if: ${{ !cancelled() && steps.python_environment.outcome == 'success' }}
        env:
          EVELYN_TEST_ATTEMPT_ROOT: runtime_artifacts/validation/test_attempts
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Preserve redacted test attempts on success or failure
        if: always() && steps.regression_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-attempts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime_artifacts/validation/test_attempts/*/result.json
            runtime_artifacts/validation/test_attempts/*/events.jsonl
          if-no-files-found: error
          overwrite: false
