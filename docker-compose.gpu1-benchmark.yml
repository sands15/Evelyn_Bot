services:
  main_llm:
    container_name: evelyn-p04-main-llm
    ports:
      - "127.0.0.1:9820:9820"

  minecraft_llm:
    container_name: evelyn-p04-qwen-llm
    ports:
      - "127.0.0.1:9823:9823"
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama:ro

  stt:
    container_name: evelyn-p04-stt
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      CUDA_VISIBLE_DEVICES: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HOME: "/tmp/huggingface-empty"
      HF_HUB_CACHE: "/root/.cache/huggingface"
      HF_TOKEN: ""
      HUGGING_FACE_HUB_TOKEN: ""
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - stt_benchmark_logs:/app/logs
      - ${EVELYN_HUGGINGFACE_CACHE_DIR:-${USERPROFILE}/.cache/huggingface}/hub:/root/.cache/huggingface:ro

volumes:
  stt_benchmark_logs:
