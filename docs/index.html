<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이블린 라이브 컨트롤</title>
  <style>
    :root {
      --bg: #f5f6f7;
      --text: #17191d;
      --soft: #626872;
      --muted: #8a9099;
      --line: rgba(23, 25, 29, 0.12);
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.92);
      --chat-panel: transparent;
      --chat-panel-user: transparent;
      --chat-input: rgba(255, 255, 255, 0.34);
      --scrollbar-track: transparent;
      --scrollbar-thumb: rgba(47, 157, 104, 0.34);
      --scrollbar-thumb-hover: rgba(47, 157, 104, 0.52);
      --shadow: 0 24px 70px rgba(20, 24, 30, 0.14);
      --green: #2f9d68;
      --danger: #c94747;
      --radius: 8px;
      --stage-bg: var(--bg);
      --memory-bg: rgba(248, 249, 250, 0.96);
      --memory-side: rgba(238, 240, 243, 0.74);
      --memory-handle: rgba(255, 255, 255, 0.82);
      --memory-handle-active: rgba(255, 255, 255, 0.94);
      --memory-handle-thickness: 3px;
      --memory-handle-active-thickness: 8px;
      --memory-move-offset: 34px;
      --memory-move-hit: 30px;
      --memory-handle-visible-gap: 2.5px;
      --memory-radius: 18px;
      --resize-corner-size: 20px;
      --resize-corner-rest: 32px;
      --resize-corner-travel: 6px;
      --resize-corner-hit: 44px;
      --resize-corner-gap: var(--memory-handle-visible-gap);
      --resize-corner-stroke: 4px;
      --resize-corner-active-stroke: 4px;
    }

    [data-theme="dark"] {
      --bg: #111316;
      --text: #f2f4f6;
      --soft: #b6bcc6;
      --muted: #7d8490;
      --line: rgba(255, 255, 255, 0.14);
      --panel: rgba(19, 21, 25, 0.72);
      --panel-strong: rgba(23, 26, 31, 0.88);
      --chat-panel: transparent;
      --chat-panel-user: transparent;
      --chat-input: rgba(17, 19, 22, 0.38);
      --scrollbar-track: transparent;
      --scrollbar-thumb: rgba(154, 203, 178, 0.34);
      --scrollbar-thumb-hover: rgba(154, 203, 178, 0.54);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      --stage-bg: var(--bg);
      --memory-bg: rgba(18, 19, 24, 0.96);
      --memory-side: rgba(31, 32, 39, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "IBM Plex Sans KR", system-ui, sans-serif;
      background: var(--bg);
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button,
    .file-button {
      display: inline-grid;
      place-items: center;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
      backdrop-filter: blur(18px);
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    button:hover,
    .file-button:hover {
      border-color: rgba(47, 157, 104, 0.34);
      background: var(--panel-strong);
    }

    button:active,
    .file-button:active {
      transform: translateY(1px);
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 680px;
      overflow: hidden;
      background: var(--stage-bg);
      background-position: center;
      background-size: cover;
    }

    .app.has-wallpaper {
      background-image:
        linear-gradient(180deg, rgba(245, 246, 247, 0.12), rgba(245, 246, 247, 0.74)),
        var(--custom-wallpaper);
    }

    [data-theme="dark"] .app.has-wallpaper {
      background-image:
        linear-gradient(180deg, rgba(17, 19, 22, 0.1), rgba(17, 19, 22, 0.78)),
        var(--custom-wallpaper);
    }

    .topbar {
      position: absolute;
      z-index: 40;
      top: 16px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      pointer-events: none;
    }

    .brand,
    .top-actions,
    .dock,
    .drawer,
    .memory-window {
      pointer-events: auto;
    }

    .brand {
      display: inline-grid;
      grid-template-columns: 42px minmax(0, auto);
      gap: 10px;
      align-items: center;
      width: max-content;
      max-width: 420px;
      min-height: 56px;
      padding: 8px 12px 8px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      color: #07351f;
      background: #d8f5e9;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand strong,
    .panel-title,
    .line strong,
    .bubble strong,
    .memory-title,
    .note strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand strong {
      display: block;
      font-size: 1rem;
    }

    .brand span,
    .caption,
    .line span,
    .meta,
    .note span,
    .memory-hint {
      color: var(--soft);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .bubble .caption {
      white-space: pre-wrap;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      justify-content: end;
      min-width: 0;
    }

    .icon-button,
    .file-button {
      width: 42px;
      height: 42px;
      padding: 0;
      font-weight: 900;
    }

    .file-button input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(330px, 0.9fr) minmax(320px, 1.1fr);
      gap: clamp(18px, 4vw, 72px);
      align-items: end;
      min-width: 0;
      padding: 96px clamp(22px, 4vw, 66px) 126px;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 78px 22px 106px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(2px);
      pointer-events: none;
    }

    [data-theme="dark"] .stage::before {
      background: rgba(255, 255, 255, 0.04);
    }

    .model-area {
      grid-column: 2;
      position: relative;
      display: grid;
      place-items: end center;
      min-width: 0;
      min-height: 100%;
    }

    .model-shadow {
      position: absolute;
      bottom: 0;
      width: min(380px, 38vw);
      height: 34px;
      border-radius: 50%;
      background: rgba(20, 24, 30, 0.2);
      filter: blur(14px);
    }

    .live2d-model {
      position: relative;
      z-index: 2;
      width: min(470px, 38vw);
      max-height: calc(100vh - 190px);
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 28px 32px rgba(20, 24, 30, 0.22));
      transform-origin: bottom center;
      animation: idle 5.2s ease-in-out infinite;
    }

    @keyframes idle {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .dock {
      position: absolute;
      z-index: 18;
      left: clamp(22px, 5vw, 78px);
      bottom: 28px;
      display: grid;
      gap: 10px;
      width: min(520px, 42vw);
    }

    .chat-log {
      display: grid;
      gap: 8px;
      max-height: min(300px, 34vh);
      overflow-y: auto;
      padding-right: 4px;
      overscroll-behavior: contain;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      scrollbar-width: thin;
    }

    .chat-log::-webkit-scrollbar,
    .command-suggestions::-webkit-scrollbar,
    textarea::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    .chat-log::-webkit-scrollbar-track,
    .command-suggestions::-webkit-scrollbar-track,
    textarea::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 999px;
    }

    .chat-log::-webkit-scrollbar-thumb,
    .command-suggestions::-webkit-scrollbar-thumb,
    textarea::-webkit-scrollbar-thumb {
      min-height: 28px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--scrollbar-thumb);
      background-clip: padding-box;
    }

    .chat-log::-webkit-scrollbar-thumb:hover,
    .command-suggestions::-webkit-scrollbar-thumb:hover,
    textarea::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
      background-clip: padding-box;
    }

    .bubble {
      display: grid;
      gap: 6px;
      max-width: 440px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--chat-panel);
      box-shadow: none;
      backdrop-filter: none;
    }

    .bubble.assistant,
    .bubble.system {
      justify-self: start;
    }

    .bubble.user {
      justify-self: end;
      background: var(--chat-panel-user);
    }

    .composer {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--chat-input);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    textarea {
      width: 100%;
      min-height: 46px;
      max-height: 120px;
      padding: 11px 10px;
      border: 0;
      color: var(--text);
      background: transparent;
      outline: 0;
      resize: vertical;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      scrollbar-width: thin;
    }

    .command-suggestions {
      position: absolute;
      left: 8px;
      right: 70px;
      bottom: calc(100% + 8px);
      z-index: 80;
      display: grid;
      gap: 4px;
      max-height: min(300px, 42vh);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      overflow: auto;
      backdrop-filter: blur(22px);
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      scrollbar-width: thin;
    }

    .command-suggestions.hidden {
      display: none;
    }

    .command-suggestion {
      display: grid;
      grid-template-columns: minmax(104px, auto) minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 34px;
      padding: 7px 8px;
      border: 0;
      border-radius: 7px;
      color: var(--text);
      background: transparent;
      text-align: left;
    }

    .command-suggestion:hover,
    .command-suggestion.active {
      background: rgba(47, 157, 104, 0.14);
    }

    .command-suggestion code {
      color: var(--green);
      font: 800 0.86rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .command-suggestion span {
      min-width: 0;
      color: var(--soft);
      font-size: 0.82rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .send {
      align-self: end;
      min-width: 54px;
      height: 42px;
      color: #ffffff;
      background: #17191d;
      border-color: #17191d;
      font-weight: 900;
    }

    [data-theme="dark"] .send {
      color: #17191d;
      background: #f2f4f6;
      border-color: #f2f4f6;
    }

    .drawer {
      position: absolute;
      z-index: 45;
      top: 76px;
      right: 16px;
      display: grid;
      gap: 14px;
      width: min(340px, calc(100vw - 32px));
      max-height: calc(100vh - 104px);
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      overflow: auto;
      transform: translateX(calc(100% + 28px));
      opacity: 0;
      pointer-events: none;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .drawer.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .panel-title {
      display: block;
      font-size: 1rem;
      font-weight: 900;
    }

    .status-list {
      display: grid;
      gap: 8px;
    }

    .line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      border-bottom: 1px solid var(--line);
    }

    .line:last-child {
      border-bottom: 0;
    }

    .line strong {
      font-size: 0.92rem;
    }

    .drawer-note {
      margin: 0;
      color: var(--soft);
      font-size: 0.82rem;
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .danger {
      color: var(--danger);
    }

    .memory-window {
      position: absolute;
      z-index: 55;
      left: min(108px, 8vw);
      top: 116px;
      display: none;
      grid-template-columns: 150px minmax(0, 1fr);
      width: min(860px, calc(100vw - 46px));
      height: min(560px, calc(100vh - 172px));
      min-width: 330px;
      min-height: 260px;
      border: 1px solid rgba(128, 134, 146, 0.28);
      border-radius: var(--memory-radius);
      background: var(--memory-bg);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(26px);
      overflow: visible;
    }

    .memory-window.open {
      display: grid;
    }

    .memory-sidebar {
      min-width: 0;
      padding: 14px;
      background: var(--memory-side);
      border-right: 1px solid var(--line);
      border-radius: calc(var(--memory-radius) - 1px) 0 0 calc(var(--memory-radius) - 1px);
      overflow: hidden;
    }

    .memory-title {
      display: block;
      margin-bottom: 12px;
      font-size: 0.98rem;
      font-weight: 900;
    }

    .memory-list {
      display: grid;
      gap: 8px;
    }

    .memory-list + .memory-list {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .memory-list[hidden] {
      display: none;
    }

    .note {
      display: grid;
      gap: 2px;
      min-height: 44px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      text-align: left;
      background: transparent;
    }

    .note.active,
    .note:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.4);
    }

    [data-theme="dark"] .note.active,
    [data-theme="dark"] .note:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .memory-content {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      padding: 18px 20px 24px;
      border-radius: 0 calc(var(--memory-radius) - 1px) calc(var(--memory-radius) - 1px) 0;
      overflow: hidden;
    }

    .memory-content h2 {
      margin: 0 0 8px;
      font-size: 1.24rem;
      letter-spacing: 0;
    }

    .memory-content p,
    .memory-content li {
      color: var(--soft);
      font-size: 0.9rem;
      line-height: 1.68;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .memory-content ul {
      margin: 10px 0 0;
      padding-left: 18px;
    }

    .memory-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .memory-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .memory-actions button {
      min-height: 34px;
      padding: 0 11px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .memory-vault-path {
      display: block;
      max-width: 100%;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .memory-pages {
      min-height: 0;
      overflow: hidden;
    }

    .memory-page {
      display: none;
      min-height: 0;
      height: 100%;
    }

    .memory-page.active {
      display: grid;
    }

    .memory-graph {
      position: relative;
      display: grid;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 25% 20%, rgba(47, 157, 104, 0.12), transparent 30%),
        rgba(255, 255, 255, 0.34);
      overflow: hidden;
    }

    [data-theme="dark"] .memory-graph {
      background:
        radial-gradient(circle at 25% 20%, rgba(80, 194, 139, 0.14), transparent 30%),
        rgba(255, 255, 255, 0.04);
    }

    .memory-graph svg {
      width: 100%;
      height: 100%;
      min-height: 360px;
      touch-action: none;
    }

    .memory-graph .edge {
      stroke: rgba(110, 117, 128, 0.34);
      stroke-width: 1.1;
    }

    .memory-graph .node {
      cursor: grab;
    }

    .memory-graph .node.dragging {
      cursor: grabbing;
    }

    .memory-graph .node circle {
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 2;
      filter: drop-shadow(0 6px 10px rgba(20, 24, 30, 0.2));
    }

    .memory-graph .node:hover circle,
    .memory-graph .node.active circle,
    .memory-graph .node.dragging circle {
      stroke: var(--green);
      stroke-width: 3;
    }

    .memory-graph .node text {
      fill: var(--text);
      font-size: 11px;
      font-weight: 800;
      paint-order: stroke;
      stroke: var(--memory-bg);
      stroke-width: 4px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .memory-graph-stats {
      position: absolute;
      left: 12px;
      bottom: 10px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--soft);
      background: var(--panel-strong);
      font-size: 0.72rem;
      backdrop-filter: blur(18px);
    }

    .memory-manager {
      display: grid;
      grid-template-columns: minmax(190px, 0.78fr) minmax(0, 1.22fr);
      gap: 12px;
      min-height: 0;
    }

    .memory-cards {
      display: grid;
      align-content: start;
      gap: 10px;
      min-height: 0;
      padding-right: 6px;
      overflow: auto;
    }

    .memory-card {
      display: grid;
      gap: 6px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.46);
      text-align: left;
    }

    .memory-card.active,
    .memory-card:hover {
      border-color: rgba(47, 157, 104, 0.45);
      background: rgba(47, 157, 104, 0.1);
    }

    [data-theme="dark"] .memory-card {
      background: rgba(255, 255, 255, 0.055);
    }

    .memory-card-head {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .memory-card-head strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .memory-badge {
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--soft);
      background: rgba(128, 134, 146, 0.14);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .memory-card-preview {
      margin: 0;
      color: var(--soft);
      font-size: 0.82rem;
      line-height: 1.55;
    }

    .memory-card-meta {
      color: var(--muted);
      font-size: 0.7rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .memory-editor {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      min-width: 0;
      min-height: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.36);
    }

    [data-theme="dark"] .memory-editor {
      background: rgba(255, 255, 255, 0.045);
    }

    .memory-editor-title {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--panel);
      outline: 0;
    }

    .memory-editor-body {
      min-height: 0;
      height: 100%;
      max-height: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      resize: none;
    }

    .memory-editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: end;
    }

    .memory-editor-actions button {
      min-height: 36px;
      padding: 0 12px;
      font-size: 0.8rem;
      font-weight: 900;
    }

    .memory-editor-actions .danger-action {
      color: #fff;
      border-color: var(--danger);
      background: var(--danger);
    }

    .memory-empty {
      display: grid;
      place-items: center;
      min-height: 180px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--soft);
      text-align: center;
    }

    .memory-move {
      position: absolute;
      left: 50%;
      bottom: calc(var(--memory-move-offset) * -1);
      display: grid;
      place-items: center;
      width: 178px;
      height: var(--memory-move-hit);
      border-radius: 999px;
      background: transparent;
      cursor: grab;
      transform: translateX(-50%);
      touch-action: none;
    }

    .memory-move::after {
      content: "";
      display: block;
      width: 128px;
      height: var(--memory-handle-thickness);
      border-radius: 999px;
      background: var(--memory-handle);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.16);
      transition: width 150ms ease, height 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .memory-move:hover::after,
    .memory-move:focus-visible::after,
    .memory-move:active::after {
      width: 148px;
      height: var(--memory-handle-active-thickness);
      background: var(--memory-handle-active);
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.22);
    }

    .memory-move:active {
      cursor: grabbing;
    }

    .resize-corner {
      position: absolute;
      z-index: 2;
      width: var(--resize-corner-hit);
      height: var(--resize-corner-hit);
      border: 0;
      background: transparent;
      touch-action: none;
    }

    .resize-corner-mark {
      position: absolute;
      z-index: -1;
      width: var(--resize-corner-size);
      height: var(--resize-corner-size);
      overflow: visible;
      opacity: 0;
      transform: translate(0, 0);
      transform-origin: center;
      pointer-events: none;
      transition: opacity 90ms ease, transform 180ms cubic-bezier(0.18, 0.9, 0.18, 1);
    }

    .resize-corner-mark path {
      fill: none;
      stroke: var(--memory-handle);
      stroke-width: var(--resize-corner-stroke);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      transition: stroke 150ms ease, stroke-width 150ms ease;
    }

    .resize-corner:hover .resize-corner-mark,
    .resize-corner:focus-visible .resize-corner-mark {
      opacity: 1;
    }

    .resize-corner:hover .resize-corner-mark path,
    .resize-corner:focus-visible .resize-corner-mark path {
      stroke: var(--memory-handle-active);
      stroke-width: var(--resize-corner-active-stroke);
    }

    .resize-corner.nw {
      top: calc(var(--resize-corner-rest) * -1);
      left: calc(var(--resize-corner-rest) * -1);
      cursor: nwse-resize;
    }

    .resize-corner.nw .resize-corner-mark {
      top: calc(var(--resize-corner-rest) - var(--resize-corner-gap) - var(--resize-corner-size));
      left: calc(var(--resize-corner-rest) - var(--resize-corner-gap) - var(--resize-corner-size));
      transform: translate(var(--resize-corner-travel), var(--resize-corner-travel)) rotate(180deg);
    }

    .resize-corner.ne {
      top: calc(var(--resize-corner-rest) * -1);
      right: calc(var(--resize-corner-rest) * -1);
      cursor: nesw-resize;
    }

    .resize-corner.ne .resize-corner-mark {
      top: calc(var(--resize-corner-rest) - var(--resize-corner-gap) - var(--resize-corner-size));
      left: calc(var(--resize-corner-hit) - var(--resize-corner-rest) + var(--resize-corner-gap));
      transform: translate(calc(var(--resize-corner-travel) * -1), var(--resize-corner-travel)) rotate(270deg);
    }

    .resize-corner.sw {
      bottom: calc(var(--resize-corner-rest) * -1);
      left: calc(var(--resize-corner-rest) * -1);
      cursor: nesw-resize;
    }

    .resize-corner.sw .resize-corner-mark {
      top: calc(var(--resize-corner-hit) - var(--resize-corner-rest) + var(--resize-corner-gap));
      left: calc(var(--resize-corner-rest) - var(--resize-corner-gap) - var(--resize-corner-size));
      transform: translate(var(--resize-corner-travel), calc(var(--resize-corner-travel) * -1)) rotate(90deg);
    }

    .resize-corner.se {
      right: calc(var(--resize-corner-rest) * -1);
      bottom: calc(var(--resize-corner-rest) * -1);
      cursor: nwse-resize;
    }

    .resize-corner.se .resize-corner-mark {
      top: calc(var(--resize-corner-hit) - var(--resize-corner-rest) + var(--resize-corner-gap));
      left: calc(var(--resize-corner-hit) - var(--resize-corner-rest) + var(--resize-corner-gap));
      transform: translate(calc(var(--resize-corner-travel) * -1), calc(var(--resize-corner-travel) * -1)) rotate(0deg);
    }

    .resize-corner.nw:hover .resize-corner-mark,
    .resize-corner.nw:focus-visible .resize-corner-mark {
      transform: translate(0, 0) rotate(180deg);
    }

    .resize-corner.ne:hover .resize-corner-mark,
    .resize-corner.ne:focus-visible .resize-corner-mark {
      transform: translate(0, 0) rotate(270deg);
    }

    .resize-corner.sw:hover .resize-corner-mark,
    .resize-corner.sw:focus-visible .resize-corner-mark {
      transform: translate(0, 0) rotate(90deg);
    }

    .resize-corner.se:hover .resize-corner-mark,
    .resize-corner.se:focus-visible .resize-corner-mark {
      transform: translate(0, 0) rotate(0deg);
    }

    @media (max-width: 900px) {
      body {

  </style>

  <script>
    const root = document.documentElement;
    const app = document.getElementById("app");
    const themeButton = document.getElementById("themeButton");
    const drawerButton = document.getElementById("drawerButton");
    const closeDrawer = document.getElementById("closeDrawer");
    const drawer = document.getElementById("drawer");
    const wallpaperInput = document.getElementById("wallpaperInput");
    const composer = document.getElementById("composer");
    const commandSuggestions = document.getElementById("commandSuggestions");
    const sendButton = document.getElementById("sendButton");
    const chatLog = document.getElementById("chatLog");
    let lastBubble = document.getElementById("lastBubble");
    const memoryWindow = document.getElementById("memoryWindow");
    const memoryMove = document.getElementById("memoryMove");
    const memoryCards = document.getElementById("memoryCards");
    const memoryHint = document.getElementById("memoryHint");
    const memoryCount = document.getElementById("memoryCount");
    const memoryVaultPath = document.getElementById("memoryVaultPath");
    const memoryRefreshButton = document.getElementById("memoryRefreshButton");
    const memoryNodeGrowButton = document.getElementById("memoryNodeGrowButton");
    const openObsidianButton = document.getElementById("openObsidianButton");
    const memoryGraph = document.getElementById("memoryGraph");
    const memoryEditTitle = document.getElementById("memoryEditTitle");
    const memoryEditBody = document.getElementById("memoryEditBody");
    const memoryEditSaveButton = document.getElementById("memoryEditSaveButton");
    const memoryConfirmButton = document.getElementById("memoryConfirmButton");
    const memoryDeleteButton = document.getElementById("memoryDeleteButton");
    let memorySnapshot = null;
    let memoryGraphSnapshot = null;
    let memoryGraphMotionFrame = 0;
    let memoryGraphMotionState = null;
    let memoryGraphDragSuppressClick = false;
    let memoryGraphResizeFrame = 0;
    let selectedMemoryId = "";
    let selectedMemoryCard = null;
    let memoryPage = "graph";
    let memoryFilter = "all";
    let memoryLoading = false;
    let memoryLoadPromise = null;
    let apiBase = "";
    let sending = false;
    let suggestionItems = [];
    let selectedSuggestionIndex = 0;
    let renderedChatSignature = "";
    let memoryGraphNodeScale = Number(localStorage.getItem("evelynMemoryGraphNodeScale") || "1") || 1;
    memoryGraphNodeScale = Math.max(1, Math.min(2, memoryGraphNodeScale));
    let commandCatalog = [
      { command: "/help", template: "/help", summary: "명령어 목록 보기", group: "기본" },
      { command: "/status", template: "/status", summary: "Evelyn, 음성, 모델 상태 요약", group: "기본" },
      { command: "/memory", template: "/memory", summary: "메모리 창 열기/숨기기", group: "페이지" },
      { command: "/obsidian", template: "/obsidian", summary: "메모리 창 열기/숨기기", group: "페이지" },
      { command: "/voice status", template: "/voice status", summary: "음성 입력, STT, TTS 상태 보기", group: "음성" },
      { command: "/voice input auto", template: "/voice input auto", summary: "로컬 마이크와 Discord 입력 자동 전환", group: "음성" },
      { command: "/voice input local", template: "/voice input local", summary: "로컬 마이크 입력 사용", group: "음성" },
      { command: "/voice input discord", template: "/voice input discord", summary: "Discord 음성 입력 사용", group: "음성" },
      { command: "/minecraft connect", template: "/minecraft connect", summary: "Voyager Minecraft 모드 시작", group: "Minecraft" },
      { command: "/autonomy status", template: "/autonomy status", summary: "Evelyn 자율 행동 엔진 상태 보기", group: "자율 행동" },
      { command: "/shutdown", template: "/shutdown", summary: "Evelyn runtime 종료", group: "시스템" }
    ];

    const savedTheme = localStorage.getItem("evelynControlTheme");
    if (savedTheme === "dark" || savedTheme === "light") {
      root.dataset.theme = savedTheme;
    }

    const savedWallpaper = localStorage.getItem("evelynControlWallpaper");
    if (savedWallpaper) {
      app.style.setProperty("--custom-wallpaper", `url("${savedWallpaper}")`);
      app.classList.add("has-wallpaper");
    }

    themeButton.addEventListener("click", () => {
      const next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      localStorage.setItem("evelynControlTheme", next);
    });

    drawerButton.addEventListener("click", () => {
      drawer.classList.toggle("open");
    });

    closeDrawer.addEventListener("click", () => {
      drawer.classList.remove("open");
    });

    wallpaperInput.addEventListener("change", () => {
      const file = wallpaperInput.files && wallpaperInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        const value = String(reader.result);
        app.style.setProperty("--custom-wallpaper", `url("${value}")`);
        app.classList.add("has-wallpaper");
        try {
          localStorage.setItem("evelynControlWallpaper", value);
        } catch {
          localStorage.removeItem("evelynControlWallpaper");
        }
      });
      reader.readAsDataURL(file);
    });

    function formatChatTime(value) {
      const seconds = Number(value);
      if (!Number.isFinite(seconds) || seconds <= 0) return "";
      const date = new Date(seconds * 1000);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    function normalizeChatMessage(message) {
      if (!message || typeof message !== "object") return null;
      const text = String(message.text || "").trim();
      if (!text) return null;
      const role = String(message.role || "assistant").toLowerCase();
      const normalizedRole = role === "user" ? "user" : (role === "system" ? "system" : "assistant");
      const fallbackAuthor = normalizedRole === "user" ? "정훈" : "이블린";
      return {
        role: normalizedRole,
        author: String(message.author || fallbackAuthor).trim() || fallbackAuthor,
        text,
        at: Number(message.at) || 0
      };
    }

    function chatSignature(messages) {
      return JSON.stringify(messages.map((message) => [
        message.role,
        message.author,
        message.text,
        message.at
      ]));
    }

    function isChatScrolledNearBottom() {
      return chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 48;
    }

    function buildChatBubble(message) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${message.role}`;
      const author = document.createElement("strong");
      const time = formatChatTime(message.at);
      author.textContent = time ? `${message.author} · ${time}` : message.author;
      const caption = document.createElement("span");
      caption.className = "caption";
      caption.textContent = message.text;
      bubble.append(author, caption);
      return bubble;
    }

    function renderChatMessages(messages) {
      if (!Array.isArray(messages)) return;
      const normalized = messages.map(normalizeChatMessage).filter(Boolean);
      if (!normalized.length) return;
      const signature = chatSignature(normalized);
      if (signature === renderedChatSignature) return;
      const shouldStick = isChatScrolledNearBottom();
      chatLog.replaceChildren(...normalized.map(buildChatBubble));
      lastBubble = chatLog.lastElementChild || lastBubble;
      renderedChatSignature = signature;
      if (shouldStick) {
        chatLog.scrollTop = chatLog.scrollHeight;
      }
    }

    function appendChatMessage(message) {
      const normalized = normalizeChatMessage(message);
      if (!normalized) return;
      const shouldStick = isChatScrolledNearBottom();
      const bubble = buildChatBubble(normalized);
      chatLog.appendChild(bubble);
      lastBubble = bubble;
      renderedChatSignature = "";
      if (shouldStick) {
        chatLog.scrollTop = chatLog.scrollHeight;
      }
    }

    function setBubble(text) {
      appendChatMessage({
        role: "assistant",
        author: "이블린",
        text,
        at: Date.now() / 1000
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function commandGroup(item) {
      const command = String((item && item.command) || "").toLowerCase();
      if (item && item.group) return item.group;
      if (command === "/memory" || command === "/obsidian") return "페이지";
      if (command.startsWith("/voice")) return "음성";
      if (command.startsWith("/minecraft") || command === "/inventory" || command.startsWith("/voyager")) return "Minecraft";
      if (command.startsWith("/autonomy")) return "자율 행동";
      if (command === "/shutdown") return "시스템";
      return "기본";
    }

    function mergeCommands(...groups) {
      const merged = new Map();
      for (const group of groups) {
        if (!Array.isArray(group)) continue;
        for (const item of group) {
          if (!item || !item.command) continue;
          const command = String(item.command);
          const key = command.toLowerCase();
          if (key.startsWith("/ui") || key.startsWith("/windows") || key.startsWith("/show")) continue;
          merged.set(key, {
            command,
            template: item.template || command,
            summary: item.summary || "",
            group: item.group || commandGroup(item)
          });
        }
      }
      return Array.from(merged.values());
    }

    function formatHelp() {
      const lines = ["페이지 명령어"];
      for (const group of ["기본", "페이지", "음성", "Minecraft", "자율 행동", "시스템"]) {
        const items = commandCatalog.filter((item) => commandGroup(item) === group);
        if (!items.length) continue;
        lines.push("", group);
        for (const item of items) {
          lines.push(`- ${item.command} - ${item.summary}`);
        }
      }
      return lines.join("\n");
    }

    function apiCandidates() {
      const candidates = [];
      if (location.protocol.startsWith("http")) candidates.push(location.origin);
      if (location.protocol !== "https:" && location.origin !== "http://127.0.0.1:8799") candidates.push("http://127.0.0.1:8799");
      if (location.protocol === "file:") candidates.push("http://127.0.0.1:8799");
      return Array.from(new Set(candidates));
    }

    async function fetchApi(path, options = {}) {
      if (!apiBase) {
        for (const candidate of apiCandidates()) {
          try {
            const response = await fetch(candidate + "/api/control-page/state", { cache: "no-store" });
            if (!response.ok) continue;
            const state = await response.json();
            apiBase = candidate;
            applyState(state);
            break;
          } catch {
            // try next candidate
          }
        }
      }
      if (!apiBase) {
        throw new Error("control page API에 연결하지 못했어.");
      }
      const response = await fetch(apiBase + path, {
        cache: "no-store",
        ...options
      });
      if (!response.ok) {
        throw new Error(`api_error:${response.status}`);
      }
      return await response.json();
    }

    function applyState(state) {
      if (!state || typeof state !== "object") return;
      const commands = mergeCommands(commandCatalog, state.commands || [], state.allCommands || []);
      if (commands.length) commandCatalog = commands;
      const runtime = state.runtime || {};
      const services = runtime.services || {};
      const voice = state.voice || {};
      const minecraft = state.minecraft || {};
      if (state.chat && Array.isArray(state.chat.messages)) {
        renderChatMessages(state.chat.messages);
      }
      const lines = Array.from(drawer.querySelectorAll(".status-list .line strong"));
      if (lines[0]) lines[0].textContent = services.mainReady ? "연결됨" : "대기";
      if (lines[1]) lines[1].textContent = voice.speaking ? "재생 중" : (services.ttsReady ? "대기" : "대기 중");
      if (lines[2]) lines[2].textContent = minecraft.sessionActive ? "연결됨" : "꺼짐";
    }

    async function refreshState() {
      try {
        await fetchApi("/api/control-page/state");
      } catch (error) {
        setBubble(`컨트롤 페이지 API 연결 확인 중: ${error.message}`);
      }
    }

    function renderSuggestions() {
      const value = composer.value.trim().toLowerCase();
      if (!commandSuggestions || !value.startsWith("/")) {
        if (commandSuggestions) commandSuggestions.classList.add("hidden");
        return;
      }
      suggestionItems = commandCatalog.filter((item) => {
        const haystack = `${item.command} ${item.summary}`.toLowerCase();
        return value === "/" || haystack.includes(value);
      });
      if (!suggestionItems.length) {
        commandSuggestions.classList.add("hidden");
        return;
      }
      selectedSuggestionIndex = Math.max(0, Math.min(selectedSuggestionIndex, suggestionItems.length - 1));
      commandSuggestions.innerHTML = suggestionItems.map((item, index) => (
        `<button class="command-suggestion${index === selectedSuggestionIndex ? " active" : ""}" type="button" data-index="${index}">` +
        `<code>${escapeHtml(item.command)}</code><span>${escapeHtml(item.summary)}</span></button>`
      )).join("");
      commandSuggestions.classList.remove("hidden");
    }

    function memoryCardsForFilter(cards) {
      if (!Array.isArray(cards)) return [];
      if (memoryFilter === "all") return cards;
      return cards.filter((card) => {
        const category = String(card.category || "").toLowerCase();
        const type = String(card.type || "").toLowerCase();
        const path = String(card.relPath || card.path || "").toLowerCase();
        if (memoryFilter === "daily") return category === "daily" || type === "daily" || path.startsWith("daily/");
        if (memoryFilter === "core") return category === "core" || type === "core" || path.startsWith("core/");
        if (memoryFilter === "project") return category === "project" || type === "project" || path.startsWith("projects/");
        return true;
      });
    }

    function setMemoryPage(page) {
      memoryPage = page === "manage" ? "manage" : "graph";
      document.querySelectorAll("[data-memory-page]").forEach((button) => {
        button.classList.toggle("active", button.getAttribute("data-memory-page") === memoryPage);
      });
      document.querySelectorAll("[data-memory-page-content]").forEach((panel) => {
        panel.classList.toggle("active", panel.getAttribute("data-memory-page-content") === memoryPage);
      });
      document.querySelectorAll("[data-memory-filter-list]").forEach((list) => {
        list.hidden = memoryPage !== "manage";
      });
      if (memoryPage === "graph") {
        renderMemoryGraph();
      } else {
        stopMemoryGraphMotion();
      }
      renderMemoryCards();
    }

    function graphNodeColor(type) {
      const key = String(type || "").toLowerCase();
      if (key === "core" || key === "project") return "hsl(154 32% 76%)";
      if (key === "procedure" || key === "concept") return "hsl(228 30% 78%)";
      if (key === "daily" || key === "episode") return "hsl(206 34% 77%)";
      if (key === "legacy") return "hsl(350 32% 80%)";
      return "hsl(210 28% 76%)";
    }

    function graphDimensions() {
      const rect = memoryGraph ? memoryGraph.getBoundingClientRect() : null;
      return {
        width: Math.max(360, Math.round((rect && rect.width) || 720)),
        height: Math.max(300, Math.round((rect && rect.height) || 420))
      };
    }

    function graphNodeRadius(importance) {
      const base = Math.max(5, Math.min(12, 5 + Number(importance || 0.5) * 7));
      return base * memoryGraphNodeScale;
    }

    function updateMemoryNodeGrowButton() {
      if (!memoryNodeGrowButton) return;
      memoryNodeGrowButton.textContent = memoryGraphNodeScale >= 1.95 ? "노드 1x" : `노드 ${memoryGraphNodeScale.toFixed(2)}x`;
      memoryNodeGrowButton.title = memoryGraphNodeScale >= 1.95 ? "노드 크기를 기본값으로 되돌리기" : "노드만 크게 보기";
    }

    function growMemoryGraphNodes() {
      memoryGraphNodeScale = memoryGraphNodeScale >= 1.95 ? 1 : Math.min(2, Number((memoryGraphNodeScale + 0.25).toFixed(2)));
      localStorage.setItem("evelynMemoryGraphNodeScale", String(memoryGraphNodeScale));
      updateMemoryNodeGrowButton();
      renderMemoryGraph();
    }

    function scheduleMemoryGraphRender() {
      if (!memoryGraph || memoryPage !== "graph" || !memoryGraphSnapshot) return;
      if (memoryGraphResizeFrame) cancelAnimationFrame(memoryGraphResizeFrame);
      memoryGraphResizeFrame = requestAnimationFrame(() => {
        memoryGraphResizeFrame = 0;
        renderMemoryGraph();
      });
    }

    function shortLabel(value, max = 16) {
      const text = String(value || "").trim();
      return text.length > max ? text.slice(0, max - 3) + "..." : text;
    }

    function extractGraphDate(value) {
      const match = String(value || "").match(/\b(20\d{2})[-./](\d{1,2})[-./](\d{1,2})\b/);
      if (!match) return "";
      return `${match[1]}-${match[2].padStart(2, "0")}-${match[3].padStart(2, "0")}`;
    }

    function acronymLabel(value) {
      const text = String(value || "").replace(/[`"'()[\]{}]/g, " ").trim();
      if (!text) return "";
      const words = text
        .split(/[^0-9A-Za-z가-힣]+/)
        .map((word) => word.trim())
        .filter(Boolean)
        .filter((word) => !/^(and|for|the|with|from|node|note|memory)$/i.test(word));
      if (!words.length) return shortLabel(text, 10).toUpperCase();
      if (words.length === 1) return shortLabel(words[0], 8).toUpperCase();
      return words.slice(0, 4).map((word) => word[0]).join("").toUpperCase();
    }

    function graphNodeLabel(node) {
      const date = extractGraphDate(node.updated_at || node.updatedAt || node.title || node.rel_path || node.id);
      if (date) return date;
      return acronymLabel(node.title || node.id);
    }

    function stopMemoryGraphMotion() {
      if (memoryGraphMotionFrame) {
        cancelAnimationFrame(memoryGraphMotionFrame);
      }
      memoryGraphMotionFrame = 0;
      memoryGraphMotionState = null;
    }

    function graphPointerPoint(event, svg) {
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      const matrix = svg.getScreenCTM();
      return matrix ? point.matrixTransform(matrix.inverse()) : point;
    }

    function clampGraphNodePosition(node, width, height) {
      const margin = Math.max(18, Number(node.radius || 8) + 8);
      node.x = Math.max(margin, Math.min(Math.max(margin, width - 120), node.x));
      node.y = Math.max(margin, Math.min(Math.max(margin, height - margin), node.y));
    }

    function applyMemoryGraphLayout(motionState) {
      if (!motionState) return;
      const { state, nodeElements, edgeElements } = motionState;
      edgeElements.forEach(({ element, source, target }) => {
        const left = state.get(source);
        const right = state.get(target);
        if (!left || !right) return;
        element.setAttribute("x1", left.x.toFixed(1));
        element.setAttribute("y1", left.y.toFixed(1));
        element.setAttribute("x2", right.x.toFixed(1));
        element.setAttribute("y2", right.y.toFixed(1));
      });

      nodeElements.forEach(({ id, circle, text }) => {
        const node = state.get(id);
        if (!node) return;
        circle.setAttribute("cx", node.x.toFixed(1));
        circle.setAttribute("cy", node.y.toFixed(1));
        if (text) {
          text.setAttribute("x", (node.x + node.radius + 5).toFixed(1));
          text.setAttribute("y", (node.y + 4).toFixed(1));
        }
      });
    }

    function startMemoryGraphNodeDrag(event) {
      if (!memoryGraphMotionState || event.button !== 0) return;
      const element = event.target.closest(".node[data-memory-id]");
      if (!element) return;
      const svg = element.ownerSVGElement;
      const id = String(element.getAttribute("data-memory-id") || "");
      const node = memoryGraphMotionState.state.get(id);
      if (!svg || !node) return;

      const width = memoryGraphMotionState.width;
      const height = memoryGraphMotionState.height;
      const origin = graphPointerPoint(event, svg);
      const start = { x: node.x, y: node.y };
      let moved = false;
      node.dragging = true;
      node.vx = 0;
      node.vy = 0;
      element.classList.add("dragging");
      element.setPointerCapture?.(event.pointerId);
      event.preventDefault();

      function move(pointerEvent) {
        if (pointerEvent.pointerId !== event.pointerId) return;
        const point = graphPointerPoint(pointerEvent, svg);
        const dx = point.x - origin.x;
        const dy = point.y - origin.y;
        if (Math.hypot(dx, dy) > 2) moved = true;
        node.x = start.x + dx;
        node.y = start.y + dy;
        clampGraphNodePosition(node, width, height);
        node.homeX = node.x;
        node.homeY = node.y;
        node.vx = 0;
        node.vy = 0;
        applyMemoryGraphLayout(memoryGraphMotionState);
      }

      function stop(pointerEvent) {
        if (pointerEvent.pointerId !== event.pointerId) return;
        node.dragging = false;
        element.classList.remove("dragging");
        element.releasePointerCapture?.(event.pointerId);
        if (moved) memoryGraphDragSuppressClick = true;
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", stop);
        window.removeEventListener("pointercancel", stop);
      }

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", stop);
      window.addEventListener("pointercancel", stop);
    }

    function startMemoryGraphMotion(nodes, visibleEdges, positions, dimensions) {
      stopMemoryGraphMotion();
      const svg = memoryGraph ? memoryGraph.querySelector("svg") : null;
      if (!svg || !nodes.length) return;

      const width = dimensions.width;
      const height = dimensions.height;
      const state = new Map();
      nodes.forEach((node, index) => {
        const point = positions.get(node.id) || { x: width / 2, y: height / 2 };
        const importance = Number(node.importance || 0.5);
        state.set(String(node.id), {
          x: point.x,
          y: point.y,
          homeX: point.x,
          homeY: point.y,
          vx: 0,
          vy: 0,
          phase: index * 0.67,
          radius: graphNodeRadius(importance)
        });
      });

      const nodeElements = Array.from(svg.querySelectorAll(".node")).map((element) => {
        const id = String(element.getAttribute("data-memory-id") || "");
        return {
          id,
          circle: element.querySelector("circle"),
          text: element.querySelector("text")
        };
      }).filter((item) => item.id && item.circle);

      const edgeElements = Array.from(svg.querySelectorAll(".edge")).map((element, index) => {
        const edge = visibleEdges[index] && visibleEdges[index].edge;
        return {
          element,
          source: edge ? String(edge.source || "") : "",
          target: edge ? String(edge.target || "") : ""
        };
      }).filter((item) => item.source && item.target);

      const motionState = { state, nodeElements, edgeElements, width, height };
      memoryGraphMotionState = motionState;
      let lastTick = 0;

      function step(now) {
        memoryGraphMotionFrame = requestAnimationFrame(step);
        if (
          document.hidden ||
          memoryPage !== "graph" ||
          !memoryWindow.classList.contains("open") ||
          memoryGraphMotionState !== motionState
        ) {
          lastTick = now;
          return;
        }
        if (now - lastTick < 32) return;
        lastTick = now;

        const time = now / 1000;
        const centerX = width / 2;
        const centerY = height / 2;
        edgeElements.forEach(({ source, target }) => {
          const left = state.get(source);
          const right = state.get(target);
          if (!left || !right) return;
          const dx = right.x - left.x;
          const dy = right.y - left.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const isPulled = Boolean(left.dragging || right.dragging);
          const stiffness = isPulled ? 0.0012 : 0.00028;
          const maxForce = isPulled ? 0.082 : 0.018;
          const force = Math.max(-maxForce, Math.min(maxForce, (distance - 94) * stiffness));
          const fx = (dx / distance) * force;
          const fy = (dy / distance) * force;
          if (!left.dragging) {
            left.vx += fx;
            left.vy += fy;
          }
          if (!right.dragging) {
            right.vx -= fx;
            right.vy -= fy;
          }
        });

        state.forEach((node) => {
          if (node.dragging) return;
          const orbitX = Math.sin(time * 0.42 + node.phase) * 12;
          const orbitY = Math.cos(time * 0.36 + node.phase * 0.8) * 9;
          node.vx += (node.homeX + orbitX - node.x) * 0.010;
          node.vy += (node.homeY + orbitY - node.y) * 0.010;
          node.vx += (centerX - node.x) * 0.0008;
          node.vy += (centerY - node.y) * 0.0008;
          node.vx *= 0.86;
          node.vy *= 0.86;
          node.x += node.vx;
          node.y += node.vy;
          clampGraphNodePosition(node, width, height);
        });

        applyMemoryGraphLayout(motionState);
      }

      memoryGraphMotionFrame = requestAnimationFrame(step);
    }

    function renderMemoryGraph() {
      if (!memoryGraph) return;
      const nodes = Array.isArray(memoryGraphSnapshot && memoryGraphSnapshot.nodes) ? memoryGraphSnapshot.nodes : [];
      const edges = Array.isArray(memoryGraphSnapshot && memoryGraphSnapshot.edges) ? memoryGraphSnapshot.edges : [];
      if (!nodes.length) {
        stopMemoryGraphMotion();
        memoryGraph.innerHTML = '<div class="memory-empty">표시할 메모리 노드가 없습니다.</div>';
        return;
      }

      const dimensions = graphDimensions();
      const width = dimensions.width;
      const height = dimensions.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const maxRadius = Math.min(width, height) * 0.43;
      const positions = new Map();
      nodes.forEach((node, index) => {
        const angle = index * 2.399963229728653;
        const radius = Math.min(maxRadius, 30 + Math.sqrt(index + 1) * 23);
        positions.set(node.id, {
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius
        });
      });

      const visibleEdges = edges
        .map((edge) => ({ edge, from: positions.get(edge.source), to: positions.get(edge.target) }))
        .filter((item) => item.from && item.to)
        .slice(0, 360);
      const edgeMarkup = visibleEdges.map(({ edge, from, to }) => (
        '<line class="edge" x1="' + from.x.toFixed(1) + '" y1="' + from.y.toFixed(1) +
        '" x2="' + to.x.toFixed(1) + '" y2="' + to.y.toFixed(1) +
        '" opacity="' + Math.max(0.18, Math.min(0.62, Number(edge.weight || 0.32))).toFixed(2) + '"></line>'
      )).join("");

      const nodeMarkup = nodes.map((node, index) => {
        const point = positions.get(node.id);
        const importance = Number(node.importance || 0.5);
        const radius = graphNodeRadius(importance);
        const label = index < 64 || node.id === selectedMemoryId ? graphNodeLabel(node) : "";
        const active = node.id === selectedMemoryId ? " active" : "";
        return (
          '<g class="node' + active + '" tabindex="0" role="button" data-memory-id="' + escapeHtml(node.id) + '">' +
          '<title>' + escapeHtml(node.title || node.id) + '</title>' +
          '<circle cx="' + point.x.toFixed(1) + '" cy="' + point.y.toFixed(1) + '" r="' + radius.toFixed(1) +
          '" fill="' + graphNodeColor(node.type) + '"></circle>' +
          (label ? '<text x="' + (point.x + radius + 5).toFixed(1) + '" y="' + (point.y + 4).toFixed(1) + '">' + escapeHtml(label) + '</text>' : '') +
          '</g>'
        );
      }).join("");

      const stats = memoryGraphSnapshot && memoryGraphSnapshot.stats ? memoryGraphSnapshot.stats : {};
      memoryGraph.innerHTML =
        '<svg viewBox="0 0 ' + width + ' ' + height + '" aria-label="메모리 노드 그래프">' +
        '<g>' + edgeMarkup + '</g><g>' + nodeMarkup + '</g></svg>' +
        '<div class="memory-graph-stats">' +
        escapeHtml(`${stats.node_count || nodes.length} nodes / ${stats.edge_count || edges.length} edges`) +
        '</div>';
      startMemoryGraphMotion(nodes, visibleEdges, positions, dimensions);
    }

    function renderMemoryEditor() {
      const hasSelection = Boolean(selectedMemoryCard && selectedMemoryId);
      if (memoryEditTitle) {
        memoryEditTitle.value = hasSelection ? (selectedMemoryCard.title || "") : "";
        memoryEditTitle.disabled = !hasSelection;
      }
      if (memoryEditBody) {
        memoryEditBody.value = hasSelection ? (selectedMemoryCard.body || "") : "";
        memoryEditBody.disabled = !hasSelection;
      }
      [memoryEditSaveButton, memoryConfirmButton, memoryDeleteButton].forEach((button) => {
        if (button) button.disabled = !hasSelection;
      });
    }

    function findMemoryCard(noteId) {
      const cards = Array.isArray(memorySnapshot && memorySnapshot.cards) ? memorySnapshot.cards : [];
      return cards.find((card) => String(card.id) === String(noteId)) || null;
    }

    async function selectMemoryCard(noteId, { openManager = true } = {}) {
      selectedMemoryId = String(noteId || "");
      selectedMemoryCard = findMemoryCard(selectedMemoryId);
      if (openManager) setMemoryPage("manage");
      renderMemoryGraph();
      renderMemoryCards();
      renderMemoryEditor();
      if (!selectedMemoryId) return;
      try {
        const payload = await fetchApi("/api/control-page/memory/" + encodeURIComponent(selectedMemoryId));
        if (payload && payload.card) {
          selectedMemoryCard = payload.card;
          renderMemoryCards();
          renderMemoryEditor();
        }
      } catch (error) {
        setBubble(`메모리 노트를 불러오지 못했어: ${error.message}`);
      }
    }

    function renderMemoryCards() {
      if (!memoryCards) return;
      const cards = memoryCardsForFilter(memorySnapshot && memorySnapshot.cards);
      const total = Array.isArray(memorySnapshot && memorySnapshot.cards) ? memorySnapshot.cards.length : 0;
      if (memoryCount) memoryCount.textContent = `${total} notes`;
      if (memoryVaultPath) memoryVaultPath.textContent = memorySnapshot && memorySnapshot.vaultPath ? memorySnapshot.vaultPath : "";
      if (memoryHint) {
        const graphCount = Array.isArray(memoryGraphSnapshot && memoryGraphSnapshot.nodes) ? memoryGraphSnapshot.nodes.length : 0;
        memoryHint.textContent = total ? `그래프 ${graphCount || total}개 노드, 수정 ${total}개 노트` : "memory_vault 노드를 기다리는 중입니다.";
      }
      if (!cards.length) {
        memoryCards.innerHTML = '<div class="memory-empty">표시할 메모리 노트가 없습니다.</div>';
        selectedMemoryCard = null;
        renderMemoryEditor();
        return;
      }
      if (!selectedMemoryId || !cards.some((card) => String(card.id) === selectedMemoryId)) {
        selectedMemoryId = String(cards[0].id || "");
        selectedMemoryCard = cards[0];
      }
      memoryCards.innerHTML = cards.map((card) => {
        const title = card.title || card.id || "Untitled";
        const badge = card.category || card.type || "note";
        const preview = card.preview || card.body || "";
        const relPath = card.relPath || card.path || card.id || "";
        const active = String(card.id || "") === selectedMemoryId ? " active" : "";
        return (
          '<article class="memory-card' + active + '" role="button" tabindex="0" data-memory-id="' + escapeHtml(card.id || "") + '">' +
          '<div class="memory-card-head">' +
          '<strong>' + escapeHtml(title) + '</strong>' +
          '<span class="memory-badge">' + escapeHtml(card.confirmed ? "확인됨" : badge) + '</span>' +
          '</div>' +
          '<p class="memory-card-preview">' + escapeHtml(preview || "내용 없음") + '</p>' +
          '<div class="memory-card-meta">' + escapeHtml(relPath) + '</div>' +
          '</article>'
        );
      }).join("");
      selectedMemoryCard = findMemoryCard(selectedMemoryId);
      renderMemoryEditor();
    }

    async function loadMemoryVault({ force = false } = {}) {
      if (memoryLoading && memoryLoadPromise) return memoryLoadPromise;
      if (memorySnapshot && memoryGraphSnapshot && !force) {
        renderMemoryGraph();
        renderMemoryCards();
        return;
      }
      memoryLoading = true;
      if (memoryHint) memoryHint.textContent = "memory_vault 노드를 불러오는 중입니다.";
      if (memoryCards && !memorySnapshot) {
        memoryCards.innerHTML = '<div class="memory-empty">메모리 노트를 불러오는 중입니다.</div>';
      }
      if (memoryGraph && !memoryGraphSnapshot) {
        memoryGraph.innerHTML = '<div class="memory-empty">메모리 노드 그래프를 불러오는 중입니다.</div>';
      }
      memoryLoadPromise = (async () => {
        const [snapshotPayload, graphPayload] = await Promise.all([
          fetchApi("/api/control-page/memory?limit=180"),
          fetchApi("/api/control-page/memory-graph?max_nodes=180")
        ]);
        memorySnapshot = snapshotPayload || { cards: [] };
        memoryGraphSnapshot = graphPayload || { nodes: [], edges: [] };
        renderMemoryGraph();
        renderMemoryCards();
      })();
      try {
        await memoryLoadPromise;
      } catch (error) {
        if (memoryHint) memoryHint.textContent = "memory_vault를 불러오지 못했습니다.";
        if (memoryGraph) {
          memoryGraph.innerHTML = '<div class="memory-empty">메모리 그래프 API 연결 실패: ' + escapeHtml(error.message) + '</div>';
        }
        if (memoryCards) {
          memoryCards.innerHTML = '<div class="memory-empty">메모리 API 연결 실패: ' + escapeHtml(error.message) + '</div>';
        }
      } finally {
        memoryLoading = false;
        memoryLoadPromise = null;
      }
    }

    async function postMemoryAction(action) {
      if (!selectedMemoryId) return;
      const payload = { action };
      if (action === "edit") {
        payload.title = memoryEditTitle ? memoryEditTitle.value : "";
        payload.body = memoryEditBody ? memoryEditBody.value : "";
      }
      [memoryEditSaveButton, memoryConfirmButton, memoryDeleteButton].forEach((button) => {
        if (button) button.disabled = true;
      });
      try {
        const result = await fetchApi("/api/control-page/memory/" + encodeURIComponent(selectedMemoryId), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!result || !result.ok) throw new Error((result && result.error) || "memory_action_failed");
        const keepSelection = action !== "hide" ? selectedMemoryId : "";
        memorySnapshot = null;
        memoryGraphSnapshot = null;
        selectedMemoryId = keepSelection;
        selectedMemoryCard = null;
        await loadMemoryVault({ force: true });
        setBubble(action === "edit" ? "메모리 노드를 수정했어." : action === "confirm" ? "메모리 노드를 확인 처리했어." : "메모리 노드를 삭제 목록으로 옮겼어.");
      } catch (error) {
        setBubble(`메모리 작업 실패: ${error.message}`);
        renderMemoryEditor();
      }
    }

    function obsidianUrlForVault() {
      const vaultPath = String((memorySnapshot && memorySnapshot.vaultPath) || "");
      if (!vaultPath) return "";
      return "obsidian://open?path=" + encodeURIComponent(vaultPath);
    }

    async function openObsidianVault() {
      toggleMemoryWindow(true);
      await loadMemoryVault({ force: false });
      setBubble("Obsidian 메모리 vault를 여는 중이야.");
      try {
        const payload = await fetchApi("/api/control-page/open-memory-vault", { method: "POST" });
        if (payload && payload.ok) {
          setBubble(payload.message || "Obsidian 메모리 vault를 열었어.");
          return;
        }
      } catch {
        // Older running servers do not have this route yet; fall back to the local protocol.
      }
      const url = obsidianUrlForVault();
      if (url) {
        window.location.href = url;
        setBubble("브라우저에서 Obsidian 열기 요청을 보냈어.");
      } else {
        setBubble("memory_vault 경로를 아직 못 받아서 Obsidian을 열 수 없어.");
      }
    }

    function toggleMemoryWindow(forceOpen) {
      const shouldOpen = typeof forceOpen === "boolean" ? forceOpen : !memoryWindow.classList.contains("open");
      memoryWindow.classList.toggle("open", shouldOpen);
      if (shouldOpen) {
        loadMemoryVault({ force: false });
      } else {
        stopMemoryGraphMotion();
      }
      setBubble(shouldOpen ? "메모리 vault를 열어둘게." : "메모리 vault는 숨겨둘게.");
    }

    async function handleSubmit() {
      const value = composer.value.trim();
      if (!value || sending) return;
      const normalized = value.toLowerCase();
      composer.value = "";
      renderSuggestions();
      if (normalized === "/memory") {
        toggleMemoryWindow();
        return;
      }
      if (normalized === "/obsidian") {
        await openObsidianVault();
        return;
      }
      if (normalized === "/" || normalized === "/help") {
        setBubble(formatHelp());
        return;
      }
      sending = true;
      sendButton.disabled = true;
      appendChatMessage({
        role: "user",
        author: "정훈",
        text: value,
        at: Date.now() / 1000
      });
      setBubble("보내는 중...");
      try {
        const payload = await fetchApi("/api/control-page/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: value })
        });
        if (payload.state) {
          applyState(payload.state);
        } else {
          setBubble(payload.reply || "응답을 받았어.");
        }
      } catch (error) {
        setBubble(`전송 실패: ${error.message}`);
      } finally {
        sending = false;
        sendButton.disabled = false;
      }
    }

    sendButton.addEventListener("click", handleSubmit);
    updateMemoryNodeGrowButton();
    if (memoryNodeGrowButton) {
      memoryNodeGrowButton.addEventListener("click", growMemoryGraphNodes);
    }
    if (memoryRefreshButton) {
      memoryRefreshButton.addEventListener("click", () => loadMemoryVault({ force: true }));
    }
    if (openObsidianButton) {
      openObsidianButton.addEventListener("click", openObsidianVault);
    }
    document.querySelectorAll("[data-memory-page]").forEach((button) => {
      button.addEventListener("click", () => {
        setMemoryPage(button.getAttribute("data-memory-page") || "graph");
      });
    });
    document.querySelectorAll("[data-memory-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        memoryFilter = button.getAttribute("data-memory-filter") || "all";
        document.querySelectorAll("[data-memory-filter]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        renderMemoryCards();
      });
    });
    if (memoryGraph) {
      if ("ResizeObserver" in window) {
        const memoryGraphResizeObserver = new ResizeObserver(scheduleMemoryGraphRender);
        memoryGraphResizeObserver.observe(memoryGraph);
      } else {
        window.addEventListener("resize", scheduleMemoryGraphRender);
      }
      memoryGraph.addEventListener("pointerdown", startMemoryGraphNodeDrag);
      memoryGraph.addEventListener("click", (event) => {
        if (memoryGraphDragSuppressClick) {
          memoryGraphDragSuppressClick = false;
          return;
        }
        const node = event.target.closest("[data-memory-id]");
        if (!node) return;
        selectMemoryCard(node.getAttribute("data-memory-id"));
      });
      memoryGraph.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const node = event.target.closest("[data-memory-id]");
        if (!node) return;
        event.preventDefault();
        selectMemoryCard(node.getAttribute("data-memory-id"));
      });
    }
    if (memoryCards) {
      memoryCards.addEventListener("click", (event) => {
        const card = event.target.closest("[data-memory-id]");
        if (!card) return;
        selectMemoryCard(card.getAttribute("data-memory-id"), { openManager: false });
      });
      memoryCards.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-memory-id]");
        if (!card) return;
        event.preventDefault();
        selectMemoryCard(card.getAttribute("data-memory-id"), { openManager: false });
      });
    }
    if (memoryEditSaveButton) {
      memoryEditSaveButton.addEventListener("click", () => postMemoryAction("edit"));
    }
    if (memoryConfirmButton) {
      memoryConfirmButton.addEventListener("click", () => postMemoryAction("confirm"));
    }
    if (memoryDeleteButton) {
      memoryDeleteButton.addEventListener("click", () => {
        if (!selectedMemoryId) return;
        if (!window.confirm("이 메모리 노드를 삭제 목록으로 옮길까요?")) return;
        postMemoryAction("hide");
      });
    }
    composer.addEventListener("input", renderSuggestions);
    composer.addEventListener("keydown", (event) => {
      if (!commandSuggestions.classList.contains("hidden") && suggestionItems.length) {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          selectedSuggestionIndex = (selectedSuggestionIndex + 1) % suggestionItems.length;
          renderSuggestions();
          return;
        }
        if (event.key === "ArrowUp") {
          event.preventDefault();
          selectedSuggestionIndex = (selectedSuggestionIndex - 1 + suggestionItems.length) % suggestionItems.length;
          renderSuggestions();
          return;
        }
        if (event.key === "Tab") {
          event.preventDefault();
          composer.value = suggestionItems[selectedSuggestionIndex].template || suggestionItems[selectedSuggestionIndex].command;
          renderSuggestions();
          return;
        }
        if (event.key === "Escape") {
          commandSuggestions.classList.add("hidden");
          return;
        }
      }
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        handleSubmit();
      }
    });

    commandSuggestions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-index]");
      if (!button) return;
      const item = suggestionItems[Number(button.dataset.index)];
      if (!item) return;
      composer.value = item.template || item.command;
      renderSuggestions();
      composer.focus();
    });

    function clampWindow(left, top, width, height) {
      const margin = 32;
      const maxLeft = window.innerWidth - width - margin;
      const maxTop = window.innerHeight - height - margin;
      return {
        left: Math.min(Math.max(margin, left), Math.max(margin, maxLeft)),
        top: Math.min(Math.max(margin, top), Math.max(margin, maxTop)),
        width: Math.min(Math.max(330, width), window.innerWidth - margin * 2),
        height: Math.min(Math.max(260, height), window.innerHeight - margin * 2)
      };
    }

    function applyWindowBox(box) {
      memoryWindow.style.left = `${box.left}px`;
      memoryWindow.style.top = `${box.top}px`;
      memoryWindow.style.width = `${box.width}px`;
      memoryWindow.style.height = `${box.height}px`;
    }

    function getWindowBox() {
      const rect = memoryWindow.getBoundingClientRect();
      return {
        left: rect.left,
        top: rect.top,
        width: rect.width,
        height: rect.height
      };
    }

    function startDrag(event) {
      event.preventDefault();
      const start = getWindowBox();
      const origin = { x: event.clientX, y: event.clientY };

      function move(pointerEvent) {
        const next = clampWindow(
          start.left + pointerEvent.clientX - origin.x,
          start.top + pointerEvent.clientY - origin.y,
          start.width,
          start.height
        );
        applyWindowBox(next);
      }

      function stop() {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", stop);
      }

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", stop);
    }

    function startResize(event) {
      event.preventDefault();
      const direction = event.currentTarget.dataset.resize;
      const start = getWindowBox();
      const origin = { x: event.clientX, y: event.clientY };

      function move(pointerEvent) {
        const dx = pointerEvent.clientX - origin.x;
        const dy = pointerEvent.clientY - origin.y;
        let left = start.left;
        let top = start.top;
        let width = start.width;
        let height = start.height;

        if (direction.includes("e")) width = start.width + dx;
        if (direction.includes("s")) height = start.height + dy;
        if (direction.includes("w")) {
          width = start.width - dx;
          left = start.left + dx;
        }
        if (direction.includes("n")) {
          height = start.height - dy;
          top = start.top + dy;
        }

        const next = clampWindow(left, top, width, height);
        applyWindowBox(next);
      }

      function stop() {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", stop);
      }

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", stop);
    }

    memoryMove.addEventListener("pointerdown", startDrag);
    document.querySelectorAll("[data-resize]").forEach((handle) => {
      handle.addEventListener("pointerdown", startResize);
    });

    refreshState();
  </script>
</body>
</html>
