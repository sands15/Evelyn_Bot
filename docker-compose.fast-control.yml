      MAIN_LLM_HOST: "main_llm_gateway"
      ROUTER_LLM_HOST: "router_llm"
      SUB_LLM_HOST: "sub_llm"
      TTS_HOST: "tts"
      STT_HOST: "stt"
      VISION_HOST: "vision"
      VOYAGER_CODEX_GATEWAY_HOST: "codex_gateway"
      MINECRAFT_AUTONOMY_SERVICE_HOST: "voyager"
      MAIN_LLM_PORT: "9819"
      ROUTER_LLM_PORT: "9822"
      SUB_LLM_PORT: "9821"
      TTS_PORT: "8880"
      STT_PORT: "8892"
      VOYAGER_CODEX_GATEWAY_PORT: "8787"
      MINECRAFT_AUTONOMY_SERVICE_PORT: "8765"
      LLM_SERVER_URL: "http://main_llm_gateway:9819/v1/chat/completions"
      MAIN_LLM_URL: "http://main_llm_gateway:9819/v1/chat/completions"
      MAIN_LLM_ADMISSION_GATEWAY_URL: "http://main_llm_gateway:9819/v1/chat/completions"
      MAIN_LLM_ADMISSION_CLIENT_MODE: "gateway"
      MAIN_LLM_IDENTITY_FILE: "/main-llm-epoch/identity"
      MAIN_LLM_SERVER_IDENTITY_FILE: "/main-llm-epoch/server-identity"
      MAIN_LLM_RUNTIME_TEMPLATE_IDENTITY_FILE: "/main-llm-epoch/runtime-template-identity"
      MAIN_LLM_PROMPT_ASSETS_EMBEDDED: "true"
      MAIN_LLM_REQUIRE_EXACT_PROMPT_ABI: "true"
      SUMMARY_LLM_URL: "http://sub_llm:9821/v1/chat/completions"
      ROUTER_LLM_URL: "http://router_llm:9822/v1/chat/completions"
      OMNIVOICE_SERVER_URL: "http://tts:8880"
      STT_SERVICE_URL: "http://stt:8892"
      VISION_SERVICE_URL: "http://vision:8891"
      VOYAGER_CODEX_GATEWAY_URL: "http://codex_gateway:8787/codex/action"
    depends_on:
      main_llm_gateway:
        condition: service_healthy
    volumes:
      - ./bot_memory:/app/bot_memory
      - ./guild_settings:/app/guild_settings
      - ./runtime_artifacts:/app/runtime_artifacts
      - ./logs:/app/logs
      - ./external:/app/external
      - ./assets:/app/assets
      - ./docs:/app/docs
      - main_llm_epoch:/main-llm-epoch:ro
    ports:
      - "127.0.0.1:8799:8799"
    networks:
      - default
      - main_llm_admission
    healthcheck:
      test: >-
        python -c "from urllib.request import urlopen; import json,sys; resp = urlopen('http://127.0.0.1:8799/health', timeout=3); payload = json.loads(resp.read() or b'{}'); sys.exit(0 if resp.getcode() == 200 and payload.get('ok') is True else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  discord_bot:
    container_name: evelyn-discord-bot
    profiles: ["discord"]
    build:
      context: .
      dockerfile: docker/Dockerfile.discord-bot
      args:
        EVELYN_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
    restart: "on-failure:3"
    stop_signal: SIGINT
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EVELYN_EXPECTED_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
      DISCORD_ENABLED: "true"
      LOCAL_ONLY: "false"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN before starting discord_bot}"
      EVELYN_VOICE_INPUT_LEASE_TOKEN: "${EVELYN_VOICE_INPUT_LEASE_TOKEN:-}"
      CROSS_SURFACE_CONTINUITY_ENABLED: "${CROSS_SURFACE_CONTINUITY_ENABLED:-false}"
      CROSS_SURFACE_CONTINUITY_GUILD_ID: "${CROSS_SURFACE_CONTINUITY_GUILD_ID:-0}"
      CROSS_SURFACE_CONTINUITY_USER_ID: "${CROSS_SURFACE_CONTINUITY_USER_ID:-0}"
      CONTROL_PAGE_ENABLED: "false"
      CONTROL_PAGE_HOST: "0.0.0.0"
      CONTROL_PAGE_PORT: "8797"
      CONTROL_PAGE_PUBLIC_PORT: "8799"
      CONTROL_PAGE_SERVICE_HOST: "control_page"
      CONTROL_PAGE_BOT_API_HOST: "bot_api"
      CONTROL_PAGE_BOT_API_PORT: "8798"
      MAIN_LLM_HOST: "main_llm_gateway"
      ROUTER_LLM_HOST: "router_llm"
      SUB_LLM_HOST: "sub_llm"
      TTS_HOST: "tts"
      STT_HOST: "stt"
      VISION_HOST: "vision"
      LLM_SERVER_URL: "http://main_llm_gateway:9819/v1/chat/completions"
      MAIN_LLM_URL: "http://main_llm_gateway:9819/v1/chat/completions"
      MAIN_LLM_ADMISSION_GATEWAY_URL: "http://main_llm_gateway:9819/v1/chat/completions"
      MAIN_LLM_ADMISSION_CLIENT_MODE: "gateway"
      MAIN_LLM_IDENTITY_FILE: "/main-llm-epoch/identity"
      MAIN_LLM_SERVER_IDENTITY_FILE: "/main-llm-epoch/server-identity"
      MAIN_LLM_RUNTIME_TEMPLATE_IDENTITY_FILE: "/main-llm-epoch/runtime-template-identity"
      MAIN_LLM_PROMPT_ASSETS_EMBEDDED: "true"
      MAIN_LLM_REQUIRE_EXACT_PROMPT_ABI: "true"
      SUMMARY_LLM_URL: "http://sub_llm:9821/v1/chat/completions"
      ROUTER_LLM_URL: "http://router_llm:9822/v1/chat/completions"
      OMNIVOICE_SERVER_URL: "http://tts:8880"
      TTS_WARMUP_GENERATE_ENABLED: "true"
      STT_SERVICE_URL: "http://stt:8892"
      STT_SERVICE_FALLBACK_LOCAL: "false"
      STT_STREAMING_ENABLED: "${STT_STREAMING_ENABLED:-true}"
      STT_FULL_RESCORING_ENABLED: "${STT_FULL_RESCORING_ENABLED:-false}"
      MINDCRAFT_LLM_BROKER_URL: "http://bot_api:8798/internal/mindcraft-llm"
      MINDCRAFT_LLM_BROKER_TOKEN_FILE: "/mindcraft-llm-broker/token"
      MINDCRAFT_LOCAL_MODEL: "Qwen3-14B-Q4_K_M.gguf"
      SPECIALIST_LLM_TIMEOUT_SEC: "${SPECIALIST_LLM_TIMEOUT_SEC:-6}"
      VOYAGER_SKILL_LLM_URL: "${VOYAGER_SKILL_LLM_URL:-http://sub_llm:9821/v1/chat/completions}"
      VOYAGER_SKILL_MODEL_NAME: "${VOYAGER_SKILL_MODEL_NAME:-gemma-4-E4B-it-Q4_K_M-text-only}"
      QWEN_ADMISSION_QUEUE_TIMEOUT_SEC: "${QWEN_ADMISSION_QUEUE_TIMEOUT_SEC:-30}"
      VISION_SERVICE_URL: "http://vision:8891"
      VISION_WATCH_ENABLED: "false"
      VOYAGER_CODEX_GATEWAY_URL: "http://codex_gateway:8787/codex/action"
      VOYAGER_CODEX_GATEWAY_HOST: "codex_gateway"
      MINECRAFT_AUTONOMY_SERVICE_HOST: "voyager"
      VOYAGER_CODEX_GATEWAY_PORT: "8787"
      MINECRAFT_AUTONOMY_SERVICE_PORT: "8765"
      MINECRAFT_WORLD_LEASE_OWNER_URL: "http://bot_api:8798"
      MINECRAFT_WORLD_LEASE_CONNECT_TIMEOUT_SEC: "${MINECRAFT_WORLD_LEASE_CONNECT_TIMEOUT_SEC:-480}"
      MINECRAFT_WORLD_LEASE_MUTATION_TIMEOUT_SEC: "${MINECRAFT_WORLD_LEASE_MUTATION_TIMEOUT_SEC:-30}"
      LOCAL_MIC_ENABLED: "false"
      LOCAL_TTS_OUTPUT_ENABLED: "false"
      VOICE_INPUT_MODE: "discord"
      VOICE_CONSOLE_ONLY_STT_AND_REPLY: "false"
      OPUS_ERROR_TO_SILENCE: "false"
      STT_USE_RAW_48K: "false"
      PYTHONUNBUFFERED: "1"
    depends_on:
      bot_api:
        condition: service_healthy
      control_page:
        condition: service_healthy
      main_llm_gateway:
        condition: service_healthy
      router_llm:
        condition: service_healthy
      minecraft_llm:
        condition: service_healthy
      sub_llm:
        condition: service_healthy
      tts:
        condition: service_healthy
      stt:
        condition: service_healthy
    volumes:
      - ./bot_memory:/app/bot_memory
      - ./bot_profiles:/app/bot_profiles
      - ./guild_settings:/app/guild_settings
      - ./runtime_artifacts:/app/runtime_artifacts
      - ./logs:/app/logs
      - ./external:/app/external
      - ./assets:/app/assets
      - ./docs:/app/docs
      - mindcraft_llm_broker_token:/mindcraft-llm-broker:ro
      - main_llm_epoch:/main-llm-epoch:ro
    networks:
      - default
      - main_llm_admission
    command: ["python", "main.py"]

  main_llm:
    container_name: evelyn-main-llm
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "${EVELYN_REALTIME_GPU_ID:-0}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "${EVELYN_REALTIME_GPU_ID:-0}"
      MAIN_LLM_PORT: "9820"
      MAIN_LLM_CONTEXT: "${MAIN_LLM_CONTEXT:-8192}"
      MAIN_LLM_N_PARALLEL: "${MAIN_LLM_N_PARALLEL:-1}"
      MAIN_LLM_BATCH_SIZE: "${MAIN_LLM_BATCH_SIZE:-2048}"
      MAIN_LLM_UBATCH_SIZE: "${MAIN_LLM_UBATCH_SIZE:-2048}"
      MAIN_LLM_CACHE_RAM_MIB: "${MAIN_LLM_CACHE_RAM_MIB:-8192}"
      MAIN_LLM_CACHE_REUSE: "${MAIN_LLM_CACHE_REUSE:-256}"
      MAIN_LLM_CUDA_GRAPHS_ENABLED: "${MAIN_LLM_CUDA_GRAPHS_ENABLED:-1}"
      GGML_CUDA_GRAPH_OPT: "${MAIN_LLM_CUDA_GRAPH_OPT:-1}"
      MAIN_LLM_SWA_FULL_ENABLED: "${MAIN_LLM_SWA_FULL_ENABLED:-1}"
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama:ro
      - ${EVELYN_MAIN_LLM_BUILD_DIR:-${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}/build-sm120-v1}:/llama/build:ro
      - main_llm_epoch:/main-llm-epoch
    networks:
      - main_llm_internal
    command:
      - bash
      - -lc
      - >-
        set -e;
        umask 077;
        model_path=/llama/models/gemma4-12b-batiai-iq4xs/google-gemma-4-12B-it-IQ4_XS.gguf;
        server_path=/llama/build/bin/llama-server;
        test -x "$${server_path}";
        grep -Eq '^CMAKE_CUDA_ARCHITECTURES:[^=]+=120a-real$$' /llama/build/CMakeCache.txt;
        runtime_template_args=(--reasoning off --reasoning-budget 0 --reasoning-format none --jinja --no-mmproj);
        case "$${MAIN_LLM_SWA_FULL_ENABLED}" in
        1) swa_full_args=(--swa-full) ;;
        0) swa_full_args=() ;;
        *) exit 64 ;;
        esac;
        server_args=(
        -m "$${model_path}"
        --host 0.0.0.0
        --port 9820
        --flash-attn on
        -ngl 999
        "$${swa_full_args[@]}"
        -c "$${MAIN_LLM_CONTEXT}"
        -np "$${MAIN_LLM_N_PARALLEL}"
        --batch-size "$${MAIN_LLM_BATCH_SIZE}"
        --ubatch-size "$${MAIN_LLM_UBATCH_SIZE}"
        --cache-ram "$${MAIN_LLM_CACHE_RAM_MIB}"
        --cache-prompt
        --cache-reuse "$${MAIN_LLM_CACHE_REUSE}"
        --metrics
        --repeat-last-n 256
        --repeat-penalty 1.10
        --presence-penalty 0.00
        --frequency-penalty 0.20
        "$${runtime_template_args[@]}"
        );
        export LD_LIBRARY_PATH=/llama/build/bin:/usr/local/cuda/lib64:$$LD_LIBRARY_PATH;
        case "$${MAIN_LLM_CUDA_GRAPHS_ENABLED}" in
        1) unset GGML_CUDA_DISABLE_GRAPHS; graph_disable_state=absent ;;
        0) export GGML_CUDA_DISABLE_GRAPHS=1; graph_disable_state=present ;;
        *) exit 64 ;;
        esac;
        sha256sum "$${model_path}" | awk '{print $$1}' > /main-llm-epoch/identity.tmp;
        test "$$(wc -c < /main-llm-epoch/identity.tmp)" -eq 65;
        runtime_manifest=/main-llm-epoch/server-runtime-manifest.tmp;
        {
        printf 'evelyn.llama-server-runtime.v1\n';
        while IFS= read -r runtime_path; do
        test -f "$${runtime_path}";
        printf 'local\t%s\t' "$${runtime_path}";
        sha256sum "$${runtime_path}" | awk '{print $$1}';
        done < <(find /llama/build/bin -maxdepth 1 \( -type f -o -type l \) \( -name llama-server -o -name '*.so*' \) -print | LC_ALL=C sort);
        while IFS= read -r runtime_path; do
        test -f "$${runtime_path}";
        printf 'linked\t%s\t' "$${runtime_path}";
        sha256sum "$${runtime_path}" | awk '{print $$1}';
        done < <(ldd "$${server_path}" | awk '$$2 == "=>" && $$3 ~ /^\// {print $$3} $$1 ~ /^\// {print $$1}' | LC_ALL=C sort -u);
        } > "$${runtime_manifest}";
        test -s "$${runtime_manifest}";
        sha256sum "$${runtime_manifest}" | awk '{print $$1}' > /main-llm-epoch/server-identity.tmp;
        test "$$(wc -c < /main-llm-epoch/server-identity.tmp)" -eq 65;
        { printf 'GGML_CUDA_GRAPHS_ENABLED=%s\0' "$${MAIN_LLM_CUDA_GRAPHS_ENABLED}"; printf 'GGML_CUDA_DISABLE_GRAPHS=%s\0' "$${graph_disable_state}"; printf 'GGML_CUDA_GRAPH_OPT=%s\0' "$${GGML_CUDA_GRAPH_OPT}"; printf '%s\0' "$${server_args[@]}"; } | sha256sum | awk '{print $$1}' > /main-llm-epoch/runtime-template-identity.tmp;
        test "$$(wc -c < /main-llm-epoch/runtime-template-identity.tmp)" -eq 65;
        sync /main-llm-epoch/identity.tmp;
        sync /main-llm-epoch/server-identity.tmp;
        sync /main-llm-epoch/runtime-template-identity.tmp;
        mv -f /main-llm-epoch/identity.tmp /main-llm-epoch/identity;
        mv -f /main-llm-epoch/server-identity.tmp /main-llm-epoch/server-identity;
        mv -f /main-llm-epoch/runtime-template-identity.tmp /main-llm-epoch/runtime-template-identity;
        rm -f "$${runtime_manifest}";
        cat /proc/sys/kernel/random/uuid > /main-llm-epoch/epoch.tmp;
        sync /main-llm-epoch/epoch.tmp;
        mv -f /main-llm-epoch/epoch.tmp /main-llm-epoch/epoch;
        exec "$${server_path}" "$${server_args[@]}"
    healthcheck:
      test: >-
        bash -lc "cat < /dev/null > /dev/tcp/127.0.0.1/9820"
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 90s

  router_llm:
    container_name: evelyn-router-llm
    profiles: ["llm", "voyager"]
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      ROUTER_LLM_PORT: "9822"
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama
    ports:
      - "127.0.0.1:9822:9822"
    command:
      - bash
      - -lc
      - >-
        export LD_LIBRARY_PATH=/llama/build/bin:/usr/local/cuda/lib64:$$LD_LIBRARY_PATH;
        exec ./build/bin/llama-server
        -m /llama/models/gemma-4-E2B-it-text-only-GGUF/gemma-4-E2B-it-Q4_K_M.gguf
        --host 0.0.0.0
        --port 9822
        --flash-attn on
        -ngl 999
        -c 1536
        --reasoning off
        --reasoning-budget 12
    healthcheck:
      test: >-
        bash -lc "exec 3<>/dev/tcp/127.0.0.1/9822; printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '\"status\":\"ok\"' <&3"
