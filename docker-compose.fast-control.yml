    profiles: ["llm", "voyager"]
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      LLAMA_CHAT_TEMPLATE_KWARGS: '{"enable_thinking":false}'
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama
      - qwen_admission_epoch:/qwen-admission
    expose:
      - "9823"
    networks:
      - qwen_admission
    depends_on:
      bot_api:
        condition: service_started
        restart: true
    command:
      - bash
      - -lc
      - >-
        set -e;
        umask 077;
        cat /proc/sys/kernel/random/uuid > /qwen-admission/epoch.tmp;
        sync /qwen-admission/epoch.tmp;
        mv -f /qwen-admission/epoch.tmp /qwen-admission/epoch;
        export LD_LIBRARY_PATH=/llama/build/bin:/usr/local/cuda/lib64:$$LD_LIBRARY_PATH;
        exec ./build/bin/llama-server
        -m /llama/models/qwen3-14b/Qwen3-14B-Q4_K_M.gguf
        --host 0.0.0.0
        --port 9823
        --flash-attn on
        -ngl 999
        -c 6144
        -np 1
        --threads 8
        --batch-size 512
        --ubatch-size 128
        --cache-type-k q8_0
        --cache-type-v q8_0
        --cache-prompt
        --reasoning off
        --reasoning-budget 0
        --reasoning-format none
        --jinja
        --no-mmproj
    healthcheck:
      test: >-
        bash -lc "exec 3<>/dev/tcp/127.0.0.1/9823; printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '\"status\":\"ok\"' <&3"
