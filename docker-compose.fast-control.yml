name: evelyn-fast-control

services:
  bot_api:
    container_name: evelyn-bot-api
    build:
      context: .
      dockerfile: docker/Dockerfile.bot-api
      args:
        EVELYN_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
    restart: "no"
    stop_grace_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EVELYN_EXPECTED_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
      EVELYN_FAST_BOOT: "1"
      FAST_CONTROL_CONTINUITY_ENABLED: "true"
      CROSS_SURFACE_CONTINUITY_ENABLED: "${CROSS_SURFACE_CONTINUITY_ENABLED:-false}"
      CROSS_SURFACE_CONTINUITY_GUILD_ID: "${CROSS_SURFACE_CONTINUITY_GUILD_ID:-0}"
      CROSS_SURFACE_CONTINUITY_USER_ID: "${CROSS_SURFACE_CONTINUITY_USER_ID:-0}"
      TZ: "Asia/Seoul"
      DISCORD_ENABLED: "false"
      LOCAL_ONLY: "true"
      CONTROL_PAGE_HOST: "0.0.0.0"
      CONTROL_PAGE_PORT: "8798"
      CONTROL_PAGE_SERVICE_HOST: "control_page"
      CONTROL_PAGE_BOT_API_HOST: "127.0.0.1"
      CONTROL_PAGE_BOT_API_PORT: "8798"
      CONTROL_PAGE_PUBLIC_PORT: "8799"
      MAIN_LLM_HOST: "main_llm"
      ROUTER_LLM_HOST: "router_llm"
      SUB_LLM_HOST: "sub_llm"
      TTS_HOST: "tts"
      STT_HOST: "stt"
      VISION_HOST: "vision"
      LLM_SERVER_URL: "http://main_llm:9820/v1/chat/completions"
      MAIN_LLM_URL: "http://main_llm:9820/v1/chat/completions"
      SUMMARY_LLM_URL: "http://sub_llm:9821/v1/chat/completions"
      ROUTER_LLM_URL: "http://router_llm:9822/v1/chat/completions"
      OMNIVOICE_SERVER_URL: "http://tts:8880"
      STT_SERVICE_URL: "http://stt:8892"
      VISION_SERVICE_URL: "http://vision:8891"
      VOYAGER_CODEX_GATEWAY_URL: "http://codex_gateway:8787/codex/action"
      VOYAGER_CODEX_GATEWAY_HOST: "codex_gateway"
      MINECRAFT_AUTONOMY_SERVICE_HOST: "voyager"
      VOYAGER_CODEX_GATEWAY_PORT: "8787"
      MINECRAFT_AUTONOMY_SERVICE_PORT: "8765"
      BOT_API_PORT: "8798"
      LOCAL_BRIDGE_STATUS_AUTH_TOKEN: "${LOCAL_BRIDGE_STATUS_AUTH_TOKEN:-}"
      EVELYN_INTERNAL_CONTROL_TOKEN: "${EVELYN_INTERNAL_CONTROL_TOKEN:-}"
      START_WAIT_TIMEOUT_SEC: "8"
      START_WAIT_INTERVAL_SEC: "1"
      OPUS_ERROR_TO_SILENCE: "false"
      STT_USE_RAW_48K: "false"
    volumes:
      - ./bot_memory:/app/bot_memory
      - ./bot_profiles:/app/bot_profiles
      - ./guild_settings:/app/guild_settings
      - ./runtime_artifacts:/app/runtime_artifacts
      - ./logs:/app/logs
      - ./external:/app/external
      - ./assets:/app/assets
      - ./docs:/app/docs
    ports:
      - "127.0.0.1:8798:8798"
    healthcheck:
      test: >-
        python -c "from urllib.request import urlopen; import json,sys; resp = urlopen('http://127.0.0.1:8798/api/control-page/state', timeout=3); payload = json.loads(resp.read() or b'{}'); sys.exit(0 if resp.getcode() == 200 and payload.get('ok') is True else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  control_page:
    container_name: evelyn-control-page
    build:
      context: .
      dockerfile: docker/Dockerfile.control-page
      args:
        EVELYN_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EVELYN_EXPECTED_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
      CONTROL_PAGE_HOST: "0.0.0.0"
      CONTROL_PAGE_PUBLIC_PORT: "8799"
      CONTROL_PAGE_BOT_API_PORT: "8798"
      CONTROL_PAGE_BOT_API_HOST: "bot_api"
      EVELYN_INTERNAL_CONTROL_TOKEN: "${EVELYN_INTERNAL_CONTROL_TOKEN:-}"
      EVELYN_VOICE_CAPTURE_HOST_AUTH_TOKEN: "${EVELYN_VOICE_CAPTURE_HOST_AUTH_TOKEN:-}"
      CONTROL_PAGE_SERVICE_HOST: "127.0.0.1"
      EVELYN_PROJECT_ROOT: /app
      EVELYN_CORE_ROOT: /app/evelyn_core
      EVELYN_CORE_RUNTIME: /app/evelyn_core/runtime
      MAIN_LLM_HOST: "main_llm"
      ROUTER_LLM_HOST: "router_llm"
      SUB_LLM_HOST: "sub_llm"
      TTS_HOST: "tts"
      STT_HOST: "stt"
      VISION_HOST: "vision"
      VOYAGER_CODEX_GATEWAY_HOST: "codex_gateway"
      MINECRAFT_AUTONOMY_SERVICE_HOST: "voyager"
      MAIN_LLM_PORT: "9820"
      ROUTER_LLM_PORT: "9822"
      SUB_LLM_PORT: "9821"
      TTS_PORT: "8880"
      STT_PORT: "8892"
      VOYAGER_CODEX_GATEWAY_PORT: "8787"
      MINECRAFT_AUTONOMY_SERVICE_PORT: "8765"
      LLM_SERVER_URL: "http://main_llm:9820/v1/chat/completions"
      MAIN_LLM_URL: "http://main_llm:9820/v1/chat/completions"
      SUMMARY_LLM_URL: "http://sub_llm:9821/v1/chat/completions"
      ROUTER_LLM_URL: "http://router_llm:9822/v1/chat/completions"
      OMNIVOICE_SERVER_URL: "http://tts:8880"
      STT_SERVICE_URL: "http://stt:8892"
      VISION_SERVICE_URL: "http://vision:8891"
      VOYAGER_CODEX_GATEWAY_URL: "http://codex_gateway:8787/codex/action"
    volumes:
      - ./bot_memory:/app/bot_memory
      - ./guild_settings:/app/guild_settings
      - ./runtime_artifacts:/app/runtime_artifacts
      - ./logs:/app/logs
      - ./external:/app/external
      - ./assets:/app/assets
      - ./docs:/app/docs
    ports:
      - "127.0.0.1:8799:8799"
    healthcheck:
      test: >-
        python -c "from urllib.request import urlopen; import json,sys; resp = urlopen('http://127.0.0.1:8799/health', timeout=3); payload = json.loads(resp.read() or b'{}'); sys.exit(0 if resp.getcode() == 200 and payload.get('ok') is True else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  discord_bot:
    container_name: evelyn-discord-bot
    profiles: ["discord"]
    build:
      context: .
      dockerfile: docker/Dockerfile.discord-bot
      args:
        EVELYN_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EVELYN_EXPECTED_SOURCE_REVISION: "${EVELYN_SOURCE_REVISION:-unversioned}"
      DISCORD_ENABLED: "true"
      LOCAL_ONLY: "false"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN before starting discord_bot}"
      CROSS_SURFACE_CONTINUITY_ENABLED: "${CROSS_SURFACE_CONTINUITY_ENABLED:-false}"
      CROSS_SURFACE_CONTINUITY_GUILD_ID: "${CROSS_SURFACE_CONTINUITY_GUILD_ID:-0}"
      CROSS_SURFACE_CONTINUITY_USER_ID: "${CROSS_SURFACE_CONTINUITY_USER_ID:-0}"
      CONTROL_PAGE_ENABLED: "false"
      CONTROL_PAGE_HOST: "0.0.0.0"
      CONTROL_PAGE_PORT: "8797"
      CONTROL_PAGE_PUBLIC_PORT: "8799"
      CONTROL_PAGE_SERVICE_HOST: "control_page"
      CONTROL_PAGE_BOT_API_HOST: "bot_api"
      CONTROL_PAGE_BOT_API_PORT: "8798"
      MAIN_LLM_HOST: "main_llm"
      ROUTER_LLM_HOST: "router_llm"
      SUB_LLM_HOST: "sub_llm"
      TTS_HOST: "tts"
      STT_HOST: "stt"
      VISION_HOST: "vision"
      LLM_SERVER_URL: "http://main_llm:9820/v1/chat/completions"
      MAIN_LLM_URL: "http://main_llm:9820/v1/chat/completions"
      SUMMARY_LLM_URL: "http://sub_llm:9821/v1/chat/completions"
      ROUTER_LLM_URL: "http://router_llm:9822/v1/chat/completions"
      OMNIVOICE_SERVER_URL: "http://tts:8880"
      STT_SERVICE_URL: "http://stt:8892"
      STT_SERVICE_FALLBACK_LOCAL: "false"
      VISION_SERVICE_URL: "http://vision:8891"
      VISION_WATCH_ENABLED: "false"
      VOYAGER_CODEX_GATEWAY_URL: "http://codex_gateway:8787/codex/action"
      VOYAGER_CODEX_GATEWAY_HOST: "codex_gateway"
      MINECRAFT_AUTONOMY_SERVICE_HOST: "voyager"
      VOYAGER_CODEX_GATEWAY_PORT: "8787"
      MINECRAFT_AUTONOMY_SERVICE_PORT: "8765"
      MINECRAFT_WORLD_LEASE_OWNER_URL: "http://bot_api:8798"
      LOCAL_MIC_ENABLED: "false"
      LOCAL_TTS_OUTPUT_ENABLED: "false"
      VOICE_INPUT_MODE: "discord"
      VOICE_CONSOLE_ONLY_STT_AND_REPLY: "false"
      OPUS_ERROR_TO_SILENCE: "false"
      STT_USE_RAW_48K: "false"
      PYTHONUNBUFFERED: "1"
    depends_on:
      bot_api:
        condition: service_healthy
      control_page:
        condition: service_healthy
      main_llm:
        condition: service_healthy
      router_llm:
        condition: service_healthy
      sub_llm:
        condition: service_healthy
      tts:
        condition: service_healthy
      stt:
        condition: service_healthy
    volumes:
      - ./bot_memory:/app/bot_memory
      - ./bot_profiles:/app/bot_profiles
      - ./guild_settings:/app/guild_settings
      - ./runtime_artifacts:/app/runtime_artifacts
      - ./logs:/app/logs
      - ./external:/app/external
      - ./assets:/app/assets
      - ./docs:/app/docs
    command: ["python", "main.py"]

  main_llm:
    container_name: evelyn-main-llm
    profiles: ["llm"]
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
      MAIN_LLM_PORT: "9820"
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama
    ports:
      - "127.0.0.1:9820:9820"
    command:
      - bash
      - -lc
      - >-
        export LD_LIBRARY_PATH=/llama/build/bin:/usr/local/cuda/lib64:$$LD_LIBRARY_PATH;
        exec ./build/bin/llama-server
        -m /llama/models/gemma4-12b-batiai-iq4xs/google-gemma-4-12B-it-IQ4_XS.gguf
        --host 0.0.0.0
        --port 9820
        --flash-attn on
        -ngl 999
        -c 8192
        -np 1
        --cache-prompt
        --cache-reuse 256
        --metrics
        --repeat-last-n 256
        --repeat-penalty 1.10
        --presence-penalty 0.00
        --frequency-penalty 0.20
        --reasoning off
        --reasoning-budget 0
        --reasoning-format none
        --jinja
        --no-mmproj
    healthcheck:
      test: >-
        bash -lc "cat < /dev/null > /dev/tcp/127.0.0.1/9820"
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 90s

  router_llm:
    container_name: evelyn-router-llm
    profiles: ["llm", "voyager"]
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      ROUTER_LLM_PORT: "9822"
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama
    ports:
      - "127.0.0.1:9822:9822"
    command:
      - bash
      - -lc
      - >-
        export LD_LIBRARY_PATH=/llama/build/bin:/usr/local/cuda/lib64:$$LD_LIBRARY_PATH;
        exec ./build/bin/llama-server
        -m /llama/models/gemma-4-E2B-it-text-only-GGUF/gemma-4-E2B-it-Q4_K_M.gguf
        --host 0.0.0.0
        --port 9822
        --flash-attn on
        -ngl 999
        -c 1536
        --reasoning off
        --reasoning-budget 12
    healthcheck:
      test: >-
        bash -lc "exec 3<>/dev/tcp/127.0.0.1/9822; printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '\"status\":\"ok\"' <&3"
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 60s

  minecraft_llm:
    container_name: evelyn-minecraft-llm
    profiles: ["voyager"]
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      LLAMA_CHAT_TEMPLATE_KWARGS: '{"enable_thinking":false}'
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama
    ports:
      - "127.0.0.1:9823:9823"
    command:
      - bash
      - -lc
      - >-
        export LD_LIBRARY_PATH=/llama/build/bin:/usr/local/cuda/lib64:$$LD_LIBRARY_PATH;
        exec ./build/bin/llama-server
        -m /llama/models/qwen3-14b/Qwen3-14B-Q4_K_M.gguf
        --host 0.0.0.0
        --port 9823
        --flash-attn on
        -ngl 999
        -c 6144
        -np 1
        --threads 8
        --batch-size 512
        --ubatch-size 128
        --cache-type-k q8_0
        --cache-type-v q8_0
        --cache-prompt
        --reasoning off
        --reasoning-budget 0
        --reasoning-format none
        --jinja
        --no-mmproj
    healthcheck:
      test: >-
        bash -lc "exec 3<>/dev/tcp/127.0.0.1/9823; printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '\"status\":\"ok\"' <&3"
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 120s

  sub_llm:
    container_name: evelyn-sub-llm
    profiles: ["llm"]
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      SUB_LLM_PORT: "9821"
    volumes:
      - ${EVELYN_LLAMA_CPP_DIR:-${USERPROFILE}/llama.cpp}:/llama
    ports:
      - "127.0.0.1:9821:9821"
    command:
      - bash
      - -lc
      - >-
        export LD_LIBRARY_PATH=/llama/build/bin:/usr/local/cuda/lib64:$$LD_LIBRARY_PATH;
        exec ./build/bin/llama-server
        -m /llama/models/gemma-4-E4B-it-text-only-GGUF/gemma-4-E4B-it-Q4_K_M.gguf
        --host 0.0.0.0
        --port 9821
        --flash-attn on
        -ngl 999
        -c 4096
        --threads 8
        --cache-type-k f16
        --cache-type-v f16
        --reasoning off
        --reasoning-budget 0
    healthcheck:
      test: >-
        bash -lc "cat < /dev/null > /dev/tcp/127.0.0.1/9821"
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 90s

  tts:
    container_name: evelyn-tts
    profiles: ["tts"]
    image: evelyn-omnivoice-tts:recipe-7cfc51e96088
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.omnivoice
      additional_contexts:
        omnivoice_source: ${EVELYN_OMNIVOICE_SERVER_DIR:-${USERPROFILE}/omnivoice-server}/omnivoice_server
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
      OMNIVOICE_HOST: "0.0.0.0"
      OMNIVOICE_PORT: "8880"
      OMNIVOICE_DEVICE: "cuda"
      OMNIVOICE_MODEL_ID: "k2-fsa/OmniVoice"
      OMNIVOICE_MODEL_REVISION: "c5fdb5ccb189668d56333f77ba2629f4cd7535f4"
      OMNIVOICE_PROFILE_DIR: "/home/ubuntu/app/profiles"
      OMNIVOICE_NUM_STEP: "32"
      OMNIVOICE_MAX_CONCURRENT: "2"
      OMNIVOICE_LOG_LEVEL: "info"
      OMNIVOICE_STREAM_STRATEGY: "sentence"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${EVELYN_OMNIVOICE_PROFILES_DIR:-./omnivoice_profiles}:/home/ubuntu/app/profiles:ro
      - ${EVELYN_OMNIVOICE_SERVER_DIR:-${USERPROFILE}/omnivoice-server}/hub:/home/ubuntu/.cache/huggingface/hub:ro
    ports:
      - "127.0.0.1:8880:8880"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; payload=json.loads(urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5).read() or b'{}'); raise SystemExit(0 if payload.get('status') == 'healthy' and payload.get('ready') is True and payload.get('model_loaded') is True and payload.get('model_id') == 'k2-fsa/OmniVoice' and payload.get('model_revision') == 'c5fdb5ccb189668d56333f77ba2629f4cd7535f4' else 1)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  voxcpm_fallback:
    container_name: evelyn-voxcpm-fallback
    profiles: ["tts-fallback"]
    image: evelyn-fast-control-tts:latest
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.voxcpm
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
      VOXCPM_MODEL_ID: "openbmb/VoxCPM2"
      VOXCPM_DEVICE: "cuda"
      VOXCPM_REFERENCE_AUDIO: "/app/profiles/evelyn/ref_audio.wav"
      VOXCPM_REFERENCE_META: "/app/profiles/evelyn/meta.json"
      VOXCPM_CFG_VALUE: "2.0"
      VOXCPM_INFERENCE_STEPS: "20"
      VOXCPM_SEED: "42"
      VOXCPM_DEFAULT_CONTROL_INSTRUCTION: "warm, natural and expressive tone, clear pronunciation, stable pace"
      VOXCPM_OUTPUT_RATE: "24000"
      VOXCPM_GPU_MEMORY_UTILIZATION: "0.90"
      VOXCPM_MAX_MODEL_LEN: "4096"
      VOXCPM_MAX_BATCHED_TOKENS: "4096"
      VOXCPM_MAX_SEQS: "2"
      VOXCPM_CONTINUATION_SEGMENTS: "2"
      VOXCPM_CONTINUATION_SOURCE: "model_exact_no_terminal"
      VOXCPM_SHORT_FULL_DECODE_MAX_CHARS: "32"
      VOXCPM_SHORT_QUALITY_RETRIES: "1"
      VOXCPM_SHORT_TARGET_RMS: "0.032"
      VOXCPM_SHORT_MAX_GAIN: "2.5"
      VOXCPM_SHORT_MAX_ROUGHNESS: "3.5"
      VOXCPM_STARTUP_WARMUP: "true"
      NANOVLLM_SERVERPOOL_NUM_KVCACHE_BLOCKS: "64"
    volumes:
      - ./docker/voxcpm_nanovllm_service.py:/app/voxcpm_nanovllm_service.py:ro
      - ${EVELYN_OMNIVOICE_PROFILES_DIR:-./omnivoice_profiles}:/app/profiles:ro
      - ${EVELYN_HUGGINGFACE_CACHE_DIR:-${USERPROFILE}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8881:8880"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; payload=json.loads(urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5).read() or b'{}'); raise SystemExit(0 if payload.get('ok') and payload.get('ready') and payload.get('backend') == 'voxcpm2-nanovllm' else 1)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s

  vision_runtime:
    container_name: evelyn-vision-runtime
    profiles: ["vision"]
    build:
      context: .
      dockerfile: docker/Dockerfile.vision
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      VISION_HOST: "0.0.0.0"
      VISION_PORT: "8891"
      VISION_DEVICE: "cuda:0"
      VISION_DTYPE: "float16"
      VISION_LOAD_SMOL: "true"
      VISION_LOAD_OCR: "false"
      VISION_TRUST_REMOTE_CODE: "false"
      VISION_OCR_REVISION: "42ec56b72a23984ac059e7c8a6d397a8529423fe"
      VISION_OCR_LOCAL_FILES_ONLY: "true"
      VISION_OCR_LAZY_LOAD: "true"
      VISION_OCR_IDLE_UNLOAD_SEC: "600"
      VISION_OCR_UNLOAD_AFTER_REQUEST: "true"
      VISION_OCR_DTYPE: "auto"
      VISION_WATCH_RUN_OCR: "false"
      EVELYN_HOST_PROJECT_ROOT: "${EVELYN_HOST_PROJECT_ROOT:-C:/Evelyn}"
      EVELYN_CONTAINER_PROJECT_ROOT: "/app"
      HF_HOME: "/model-cache"
      HF_HUB_CACHE: "/model-cache/hub"
      HF_HUB_OFFLINE: "1"
      HF_MODULES_CACHE: "/tmp/hf-modules"
      TORCH_EXTENSIONS_DIR: "/tmp/torch-extensions"
      TRITON_CACHE_DIR: "/tmp/triton"
      XDG_CACHE_HOME: "/tmp/xdg-cache"
      HOME: "/tmp/vision-home"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=4g
    volumes:
      - ./runtime_artifacts:/app/runtime_artifacts:ro
      - ./logs:/app/logs:ro
      - ${EVELYN_HUGGINGFACE_CACHE_DIR:-${USERPROFILE}/.cache/huggingface}:/model-cache:ro
    networks:
      - vision_isolated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8891/health')"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s

  vision:
    container_name: evelyn-vision
    profiles: ["vision"]
    build:
      context: .
      dockerfile: docker/Dockerfile.vision-ingress
    restart: "no"
    depends_on:
      vision_runtime:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    networks:
      - default
      - vision_isolated
    ports:
      - "127.0.0.1:8891:8891"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8891/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 10s

  stt:
    container_name: evelyn-stt
    profiles: ["stt"]
    build:
      context: .
      dockerfile: docker/Dockerfile.stt
    restart: "no"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
      STT_HOST: "0.0.0.0"
      STT_PORT: "8892"
      STT_MODEL_NAME: "Qwen/Qwen3-ASR-1.7B"
      STT_LANGUAGE: "ko"
      STT_FORCE_LANGUAGE: "true"
      STT_COMPUTE_TYPE: "float16"
      STT_LOAD_ON_START: "true"
      STT_MAX_AUDIO_SEC: "30"
    volumes:
      - ./logs:/app/logs
      - ${EVELYN_HUGGINGFACE_CACHE_DIR:-${USERPROFILE}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8892:8892"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; payload=json.loads(urllib.request.urlopen('http://127.0.0.1:8892/health', timeout=5).read() or b'{}'); raise SystemExit(0 if payload.get('ok') and payload.get('ready') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s

  codex_gateway:
    container_name: evelyn-codex-gateway
    profiles: ["voyager"]
    build:
      context: .
      dockerfile: docker/Dockerfile.voyager
    restart: "no"
    environment:
      VOYAGER_CODEX_GATEWAY_HOST: "0.0.0.0"
      VOYAGER_CODEX_GATEWAY_PORT: "8787"
      VOYAGER_CODEX_MODEL: "gpt-5.5"
      VOYAGER_CODEX_GATEWAY_BACKEND: "codex-exec"
      VOYAGER_CODEX_GATEWAY_WORKDIR: "/app"
      EVELYN_ALLOW_CUSTOM_GATEWAY_COMMAND: "false"
      EVELYN_CODEX_CREDENTIALS_DIR: "/run/secrets/evelyn-codex"
      CODEX_HOME: "/tmp/evelyn-codex-home"
      EVELYN_PROJECT_ROOT: /app
      EVELYN_CORE_ROOT: /app/evelyn_core
      EVELYN_CORE_RUNTIME: /app/evelyn_core/runtime
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/evelyn-codex-home:mode=0700,uid=0,gid=0
    volumes:
      - ./runtime_artifacts:/app/runtime_artifacts
      - ./logs:/app/logs
      - ${EVELYN_CODEX_CREDENTIALS_DIR:-./runtime_artifacts/secrets/codex_device_home}:/run/secrets/evelyn-codex:ro
    ports:
      - "127.0.0.1:8787:8787"
    command: ["python", "-m", "evelyn_core.codex_gateway_server", "--host", "0.0.0.0", "--port", "8787"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; payload=json.loads(urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read() or b'{}'); raise SystemExit(0 if payload.get('ok') else 1)"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 20s

  voyager:
    container_name: evelyn-mindcraft
    profiles: ["voyager"]
    build:
      context: .
      dockerfile: docker/Dockerfile.mindcraft
    restart: "no"
    environment:
      MINECRAFT_AUTONOMY_SERVICE_HOST: "0.0.0.0"
      MINECRAFT_AUTONOMY_SERVICE_PORT: "8765"
      MINDCRAFT_ROOT: "/app/mindcraft"
      MINDCRAFT_AGENT_PROFILE: "/app/mindcraft/profiles/evelyn.json"
      MINDCRAFT_STATUS_PATH: "/app/runtime_artifacts/mindcraft/status.json"
      MINDCRAFT_CODEX_GATEWAY_URL: "http://codex_gateway:8787/codex/action"
      MINDCRAFT_CODEX_MODEL: "gpt-5.5"
      MINDCRAFT_CODEX_TIMEOUT_SEC: "240"
      MINDCRAFT_CODEX_COOLDOWN_SEC: "30"
      MINDCRAFT_PLANNER_STATE_PATH: "/app/runtime_artifacts/mindcraft/planner_state.json"
      MINDCRAFT_GOAL_MANAGER_STATE_PATH: "/app/runtime_artifacts/mindcraft/goal_manager_state.json"
      MINDCRAFT_GOAL_MANAGER_MODE: "gated"
      MINDCRAFT_DETERMINISTIC_TOOL_BOOTSTRAP: "false"
      MINDCRAFT_LOCAL_LLM_URL: "http://minecraft_llm:9823/v1/chat/completions"
      MINDCRAFT_LOCAL_MODEL: "Qwen3-14B-Q4_K_M.gguf"
      MINDCRAFT_LOCAL_TIMEOUT_SEC: "90"
      MINDCRAFT_LOCAL_MAX_TOKENS: "160"
      MINDCRAFT_ROUTER_URL: "http://router_llm:9822/v1/chat/completions"
      MINDCRAFT_ROUTER_MODEL: "gemma-4-E2B-it-Q4_K_M.gguf"
      MINDCRAFT_ROUTER_TIMEOUT_SEC: "4"
      MINDCRAFT_ALLOWED_PLAYERS: "${MINDCRAFT_ALLOWED_PLAYERS:-}"
      MINDSERVER_PORT: "8080"
      MINEFLAYER_HOST: "host.docker.internal"
      MINEFLAYER_PORT: "25565"
      MINEFLAYER_AUTH: "microsoft"
      MINECRAFT_VERSION: "1.21.11"
      MINECRAFT_USERNAME: "${MINEFLAYER_USERNAME:-Evelyn_0428}"
      MINEFLAYER_PROFILES_FOLDER: "/app/bot_profiles"
      MINDCRAFT_ENABLE_SKIN_COMMANDS: "false"
      VOYAGER_CODEX_GATEWAY_TOKEN_FILE: "/app/runtime_artifacts/secrets/codex_gateway.token"
      EVELYN_PROJECT_ROOT: /app
      EVELYN_CORE_ROOT: /app/evelyn_core
      EVELYN_CORE_RUNTIME: /app/evelyn_core/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      router_llm:
        condition: service_healthy
      minecraft_llm:
        condition: service_healthy
      codex_gateway:
        condition: service_healthy
    volumes:
      - ./bot_memory/mindcraft:/app/mindcraft/bots/Evelyn_0428
      - ./bot_profiles:/app/bot_profiles
      - ./runtime_artifacts:/app/runtime_artifacts
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8765:8765"
    command: ["python3", "-m", "evelyn_core.mindcraft_service", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; payload=json.loads(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read() or b'{}'); raise SystemExit(0 if payload.get('ok') else 1)"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 20s

networks:
  vision_isolated:
    internal: true
